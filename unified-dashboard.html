<!DOCTYPE html>
<html lang="my">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Safe Deli — စီမံခန့်ခွဲမှု Dashboard</title>
<style>
:root{
  --purple:#5422c8; --violet:#7C3AED; --violet-dark:#3B1A7A; --pink:#EC4899;
  --gold:#D4AF37; --bg:#F4F2FB; --card:#fff; --ink:#1E1B2E; --muted:#6B6580;
  --line:#E7E2F5; --green:#16A34A; --green-bg:#DCFCE7; --amber:#D97706; --amber-bg:#FEF3C7;
  --red:#DC2626; --red-bg:#FEE2E2; --blue:#2563EB; --blue-bg:#DBEAFE;
}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans Myanmar",sans-serif;background:var(--bg);color:var(--ink);font-size:15px}
a{color:var(--purple)}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:15px;padding:9px 10px;border:1px solid var(--line);border-radius:9px;background:#fff;width:100%}
input:focus,select:focus,textarea:focus{outline:2px solid var(--violet);outline-offset:0;border-color:var(--violet)}
h1{font-size:22px;margin:0 0 4px} h2{font-size:17px;margin:0 0 10px} h3{font-size:15px;margin:0 0 8px}
.muted{color:var(--muted);font-size:13px} .small{font-size:12.5px}
.hidden{display:none!important}
/* ---------- login ---------- */
#loginWrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:linear-gradient(135deg,#3B1A7A,#5422c8 55%,#7C3AED)}
.login-card{background:#fff;border-radius:18px;padding:28px 26px;width:100%;max-width:380px;box-shadow:0 18px 50px rgba(0,0,0,.35);text-align:center}
.login-card img.logo{width:96px;height:96px;border-radius:50%;object-fit:cover;border:3px solid var(--line)}
.login-card h1{margin:12px 0 2px}
.login-card form{text-align:left;margin-top:18px}
.login-card label{display:block;font-size:13px;color:var(--muted);margin:12px 0 5px}
.login-card .err{color:var(--red);font-size:13px;margin-top:10px;min-height:18px}
.pw-wrap{position:relative}
.pw-wrap input{padding-right:44px}
.pw-eye{position:absolute;right:6px;top:50%;transform:translateY(-50%);border:0;background:transparent;font-size:19px;line-height:1;cursor:pointer;padding:6px;color:var(--muted);width:auto}
.pw-eye:focus{outline:2px solid var(--violet);border-radius:6px}
/* ---------- shop form: AM/PM time picker (no typing) ---------- */
.time-picker{display:flex;gap:6px}
.time-picker select{flex:1;min-width:0;padding:9px 4px;text-align:center}
/* ---------- shop form: media frames (2026-11-13, Min: use the CURRENT
   frames — they are beautiful, do not build different/new ones).
   This is the app's gold photo frame, copied verbatim (v15 frames +
   v19 ring fix): a 3px dark-bronze ring that is always there, plus a
   bright gold arc that travels around it (4s). The uploaded picture
   sits inside it, so the preview looks exactly like the app's
   shop-photo and Menu dish cards. ---------- */
.frame-gold{position:relative; overflow:hidden; padding:3px; background:linear-gradient(135deg,#8A6508,#6B4E00); box-shadow:0 0 10px rgba(245,197,24,.45)}
.frame-gold::before{content:""; position:absolute; inset:-50%; animation:frame-spin 4s linear infinite; pointer-events:none; background:conic-gradient(from 0deg, transparent 0deg, transparent 240deg, #F5C518 270deg, #FFE97A 300deg, #FFFFFF 325deg, #FFF3B0 345deg, #F5C518 360deg)}
@keyframes frame-spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){.frame-gold::before{animation:none}}
.frame-gold img,.frame-gold video{position:relative; z-index:1; width:100%; height:100%; object-fit:cover; display:block}
.frame-gold video{background:#000}
/* Preview sizes: one big frame for a single photo/video/menu (full
   width on a phone, 16:9), two-per-row frames for photo lists. */
.thumb-single .frame-gold{width:100%; max-width:340px; aspect-ratio:16/9; border-radius:12px; margin-top:8px}
.thumb-single .frame-gold img,.thumb-single .frame-gold video{border-radius:9px}
.thumb-grid{display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:8px}
.thumb-grid .frame-gold{aspect-ratio:4/3; border-radius:10px}
.thumb-grid .frame-gold img,.thumb-grid .frame-gold video{border-radius:8px}
.thumb:empty{display:none}
/* Gold NEW badge on the menu frame (Min 2026-11-13: NEW in real gold
   #A67C00, at the corner of the picture — never green). */
.new-badge{position:absolute; top:6px; right:6px; z-index:2; background:#A67C00; color:#fff; font-size:11px; font-weight:800; padding:3px 8px; border-radius:999px; box-shadow:0 1px 4px rgba(0,0,0,.25)}
.up-row{margin-top:6px}
.up-row input[type=file]{width:100%}
.up-status{font-size:13px;color:var(--muted);margin-top:4px;min-height:16px}
/* Dish photo frame in the Products list (same gold frame, smaller). */
.prod-frame{width:120px; height:90px; border-radius:10px; flex:none}
.prod-frame img{border-radius:8px}
.form-sec{grid-column:1/-1;font-weight:700;margin-top:8px}
.form-sec .muted{font-weight:400}
.btn{display:inline-block;border:0;border-radius:10px;padding:10px 16px;font-size:15px;font-weight:600;background:var(--purple);color:#fff}
.btn:hover{background:#4520a8} .btn:disabled{opacity:.55;cursor:default}
.btn.ghost{background:#fff;color:var(--purple);border:1px solid var(--purple)}
.btn.danger{background:var(--red)} .btn.green{background:var(--green)} .btn.sm{padding:6px 10px;font-size:13px;border-radius:8px}
.btn.block{width:100%}
/* ---------- app shell ---------- */
#app{display:flex;min-height:100vh}
aside.sidebar{width:248px;flex:0 0 248px;background:linear-gradient(180deg,#2E1065,#5422c8 70%,#6D28D9);color:#fff;display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
.brand{display:flex;align-items:center;gap:10px;padding:16px 16px 12px}
.brand img{width:46px;height:46px;border-radius:50%;object-fit:cover;border:2px solid rgba(255,255,255,.5);background:#fff}
.brand .name{font-size:18px;font-weight:800;line-height:1.1}
.brand .sub{font-size:11.5px;opacity:.85}
nav.menu{flex:1;overflow-y:auto;padding:6px 10px 16px}
nav.menu button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:transparent;border:0;color:#EDE9FE;padding:10px 12px;border-radius:10px;font-size:14.5px;margin-bottom:2px}
nav.menu button:hover{background:rgba(255,255,255,.12)}
nav.menu button.active{background:#fff;color:var(--violet-dark);font-weight:700}
nav.menu button .ic{font-size:17px;flex:0 0 22px;text-align:center;line-height:1}
nav.menu button .badge{margin-left:auto;background:var(--pink);color:#fff;border-radius:20px;padding:1px 8px;font-size:12px;font-weight:700}
nav.menu .sect{font-size:11px;letter-spacing:.08em;text-transform:uppercase;opacity:.65;padding:14px 12px 5px}
.side-foot{padding:12px 16px;border-top:1px solid rgba(255,255,255,.2);font-size:12.5px;opacity:.9}
main.main{flex:1;min-width:0;display:flex;flex-direction:column}
header.topbar{background:#fff;border-bottom:1px solid var(--line);padding:10px 20px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;position:sticky;top:0;z-index:20}
header.topbar .hamb{display:none;border:1px solid var(--line);background:#fff;border-radius:9px;padding:8px 11px;font-size:16px}
header.topbar input.search{max-width:340px}
.top-right{margin-left:auto;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.role-pill{background:var(--violet);color:#fff;border-radius:20px;padding:5px 12px;font-size:13px;font-weight:700}
#view{padding:20px;max-width:1280px;width:100%;margin:0 auto}
.view-head{display:flex;flex-wrap:wrap;align-items:flex-end;gap:10px;margin-bottom:16px}
.view-head .spacer{flex:1}
/* ---------- cards / KPI ---------- */
.grid{display:grid;gap:14px}
.kpis{grid-template-columns:repeat(5,1fr)}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}
.kpi .lbl{font-size:13px;color:var(--muted)}
.kpi .val{font-size:26px;font-weight:800;margin:4px 0 2px}
.kpi .trend{font-size:12.5px;color:var(--green);font-weight:600}
.kpi.grad{color:#fff;border:0}
.kpi.grad .lbl,.kpi.grad .trend{color:rgba(255,255,255,.85)}
.g1{background:linear-gradient(135deg,#4F46E5,#7C3AED)} .g2{background:linear-gradient(135deg,#0EA5E9,#6366F1)}
.g3{background:linear-gradient(135deg,#F59E0B,#EC4899)} .g4{background:linear-gradient(135deg,#7C3AED,#DB2777)}
.g5{background:linear-gradient(135deg,#059669,#0EA5E9)}
.cards2{grid-template-columns:2fr 1fr} .cards3{grid-template-columns:1fr 1fr 1fr} .cards32{grid-template-columns:3fr 2fr}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}
.card h2{display:flex;align-items:center;gap:8px}
.card h2 .more{margin-left:auto;font-size:13px;font-weight:600}
/* ---------- tables ---------- */
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;color:var(--muted);font-size:12.5px;padding:8px 8px;border-bottom:2px solid var(--line);white-space:nowrap}
td{padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
.tbl-wrap{overflow-x:auto}
.pill{display:inline-block;border-radius:20px;padding:2px 10px;font-size:12.5px;font-weight:700;white-space:nowrap}
.pill.green{background:var(--green-bg);color:#166534} .pill.amber{background:var(--amber-bg);color:#92400E}
.pill.red{background:var(--red-bg);color:#991B1B} .pill.blue{background:var(--blue-bg);color:#1E40AF}
.pill.grey{background:#F1F5F9;color:#475569} .pill.purple{background:#EDE9FE;color:#5B21B6}
.pill.new{background:#FEF3C7;color:#A67C00;border:1px solid #C9A227} /* NEW is always real gold #A67C00, never green (Min 2026-11-13) */
.pill.test{background:#FEF9C3;color:#854D0E;border:1px dashed #EAB308}
.empty{padding:26px;text-align:center;color:var(--muted)}
/* ---------- chart / donut ---------- */
.bars{display:flex;align-items:flex-end;gap:10px;height:150px;padding:8px 4px 0}
.bar-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end}
.bar{width:100%;max-width:44px;border-radius:6px 6px 0 0;background:linear-gradient(180deg,var(--violet),var(--purple));min-height:3px}
.bar-col .d{font-size:11.5px;color:var(--muted)}
.bar-col .v{font-size:11.5px;font-weight:700}
.donut-wrap{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.donut{width:150px;height:150px;border-radius:50%;flex:0 0 150px;display:flex;align-items:center;justify-content:center;position:relative}
.donut::after{content:"";position:absolute;inset:26px;background:#fff;border-radius:50%}
.donut .center{position:relative;z-index:1;text-align:center}
.donut .center b{font-size:22px;display:block}
.donut .center span{font-size:12px;color:var(--muted)}
.legend{list-style:none;margin:0;padding:0;font-size:13.5px}
.legend li{display:flex;gap:8px;align-items:center;padding:4px 0}
.legend .sw{width:12px;height:12px;border-radius:4px;flex:0 0 12px}
.legend b{margin-left:auto;padding-left:14px}
/* ---------- misc ---------- */
.notice{border-radius:12px;padding:12px 14px;font-size:14px;margin-bottom:14px}
.notice.amber{background:var(--amber-bg);color:#78350F;border:1px solid #FDE68A}
.notice.blue{background:var(--blue-bg);color:#1E3A8A;border:1px solid #BFDBFE}
.notice.green{background:var(--green-bg);color:#14532D;border:1px solid #BBF7D0}
.checklist{list-style:none;margin:0;padding:0}
.checklist li{padding:6px 0;border-bottom:1px dashed var(--line);font-size:14px}
.checklist li:last-child{border-bottom:0}
.checklist .ok{color:var(--green);font-weight:700} .checklist .no{color:var(--red);font-weight:700}
.row-flex{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row-flex>*{flex:1;min-width:160px}
.tabs{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.tabs button{border:1px solid var(--line);background:#fff;border-radius:20px;padding:8px 16px;font-size:14px}
.tabs button.active{background:var(--purple);color:#fff;border-color:var(--purple);font-weight:700}
.kv{display:grid;grid-template-columns:150px 1fr;gap:6px 12px;font-size:14px}
.kv dt{color:var(--muted)} .kv dd{margin:0;overflow-wrap:anywhere;word-break:break-word;min-width:0}
.kv>*{min-width:0} .grid>*{min-width:0}
#langSel,#loginLangSel{width:auto}
/* ---------- dark theme (body.dark) ---------- */
body.dark{--bg:#150A28;--card:#2A1650;--ink:#F3EFFF;--muted:#C4B5FD;--line:#3D2A6B;--green-bg:#14532D;--amber-bg:#451A03;--red-bg:#450A0A;--blue-bg:#172554;--gold:#F5C542;--gold2:#F59E0B}
body.dark input,body.dark select,body.dark textarea{background:#2E2844;color:var(--ink);border-color:var(--line)}
body.dark header.topbar{background:#241F33}
body.dark .tabs button{background:#2E2844;color:var(--ink);border-color:var(--line)}
body.dark .btn.ghost{background:#241F33;color:#D4AF37;border-color:#A67C00}
body.dark aside.sidebar{background:linear-gradient(180deg,#1E0B45,#3B1A7A 70%,#5422c8)}
body.dark .donut::after{background:var(--card)}
body.dark .notice.amber{background:#451A03;color:#FDE68A;border-color:#92400E}
body.dark .notice.blue{background:#172554;color:#BFDBFE;border-color:#1E40AF}
body.dark .notice.green{background:#14532D;color:#BBF7D0;border-color:#166534}
body.dark .login-card{background:#241F33;color:var(--ink)}
body.dark .login-card label{color:var(--muted)}
body.dark .pill.green{background:var(--green-bg);color:#BBF7D0}
body.dark .pill.amber{background:var(--amber-bg);color:#FDE68A}
body.dark .pill.red{background:var(--red-bg);color:#FECACA}
body.dark .pill.blue{background:var(--blue-bg);color:#BFDBFE}
body.dark .pill.grey{background:#3A334F;color:#D6D3E0}
body.dark .pill.purple{background:#3B1A7A;color:#DDD6FE}
textarea{resize:vertical;min-height:80px}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.form-grid .full{grid-column:1/-1}
label.flabel{display:block;font-size:13px;color:var(--muted);margin-bottom:5px}
.err-text{color:var(--red);font-size:13.5px;margin-top:8px;min-height:18px}
.ok-text{color:var(--green);font-size:13.5px;margin-top:8px;min-height:18px}
.pager{display:flex;gap:10px;align-items:center;margin-top:12px;font-size:13.5px}
/* ---------- responsive: preview breakpoints 760 / 980 / 1200 ---------- */
@media (max-width:1200px){ .kpis{grid-template-columns:repeat(3,1fr)} .cards3{grid-template-columns:1fr 1fr} }
@media (max-width:980px){
  .kpis{grid-template-columns:repeat(2,1fr)} .cards2,.cards32,.cards3{grid-template-columns:1fr}
  aside.sidebar{position:fixed;left:0;top:0;bottom:0;z-index:50;transform:translateX(-105%);transition:transform .2s;box-shadow:0 0 40px rgba(0,0,0,.3)}
  aside.sidebar.open{transform:none}
  header.topbar .hamb{display:inline-block}
}
@media (max-width:760px){
  #view{padding:14px} .kpis{grid-template-columns:1fr 1fr} .form-grid{grid-template-columns:1fr}
  .kpi .val{font-size:21px} header.topbar input.search{display:none} #apiState{display:none}
  /* Shops as stacked cards on phones (2026-11-13): the wide table
     squeezed the address into a narrow edge column. Each shop becomes
     a full-width card — name, address, phone, GPS, status and all
     buttons visible with no horizontal scrolling. */
  .shop-list .tbl-wrap{overflow:visible}
  .shop-list table,.shop-list tbody,.shop-list tr,.shop-list td{display:block;width:100%}
  .shop-list thead{display:none}
  .shop-list tr{background:var(--bg);border:1px solid var(--line);border-radius:12px;margin-bottom:12px;padding:10px 12px}
  .shop-list td{border:0;padding:5px 0}
  .shop-list td[data-lbl]::before{content:attr(data-lbl);display:block;font-size:12px;color:var(--muted);margin-bottom:2px}
  .shop-list td[data-lbl=""]::before{display:none}
  .shop-list td .btn{margin:2px 4px 2px 0}
  /* Products as stacked cards on phones too (same pattern): one
     dish per card — photo frame, name, price, order buttons. */
  .prod-list .tbl-wrap{overflow:visible}
  .prod-list table,.prod-list tbody,.prod-list tr,.prod-list td{display:block;width:100%}
  .prod-list thead{display:none}
  .prod-list tr{background:var(--bg);border:1px solid var(--line);border-radius:12px;margin-bottom:12px;padding:10px 12px}
  .prod-list td{border:0;padding:5px 0}
  .prod-list td[data-lbl]::before{content:attr(data-lbl);display:block;font-size:12px;color:var(--muted);margin-bottom:2px}
  .prod-list td[data-lbl=""]::before{display:none}
  .prod-list td .btn{margin:2px 4px 2px 0}
}

/* ---------- v2 dark preview design (overview + shell) ---------- */
body.dark aside.sidebar{background:linear-gradient(180deg,#1E0B45,#2A1350 55%,#3B1A7A);border-right:1px solid #3D2A6B}
body.dark aside.sidebar .brand .logo{width:44px;height:44px;border-radius:10px;background:linear-gradient(135deg,#FDE68A,#F59E0B);color:#3B1A7A;font-weight:900;font-size:18px;display:flex;align-items:center;justify-content:center;flex:0 0 44px}
body.dark aside.sidebar .brand .name{color:#fff}
body.dark aside.sidebar .brand .sub{color:#C4B5FD}
.owner-pill{margin:10px 14px 0;background:linear-gradient(135deg,#FDE68A,#F59E0B);color:#3B1A7A;border-radius:20px;padding:7px 10px;text-align:center;font-weight:800;font-size:13px}
body.dark nav.menu button{color:#EDE9FE;border-radius:10px}
body.dark nav.menu button.active{background:linear-gradient(135deg,#7C3AED,#A855F7);color:#fff}
body.dark nav.menu button .badge{margin-left:auto;background:var(--pink);color:#fff;border-radius:20px;padding:1px 8px;font-size:12px;font-weight:700}
body.dark nav.menu button .soon{margin-left:auto;border:1px solid var(--gold2);color:var(--gold);border-radius:20px;padding:1px 8px;font-size:11px;font-weight:700}
body.dark nav.menu .sect{color:#A89FC4;font-size:11px;text-transform:uppercase;letter-spacing:.08em;padding:14px 12px 6px}
.status-card{background:rgba(0,0,0,.25);border:1px solid #3D2A6B;border-radius:12px;padding:12px;margin:0 14px 14px;color:#EDE9FE}
.status-card .status-t{font-weight:800;color:#fff;margin-bottom:8px}
.status-card .status-row{display:flex;justify-content:space-between;padding:3px 0;font-size:13px}
.status-card .dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#22C55E;margin-right:6px}
.status-card .ok{color:#4ADE80}
body.dark header.topbar{background:#1E0B45;border-bottom:1px solid #3D2A6B}
body.dark header.topbar .search{background:#2A1650;color:var(--ink);border-color:#3D2A6B}
/* overview */
.ov-kpis{display:grid;grid-template-columns:repeat(6,1fr);gap:12px}
.ov-kpi{border-radius:14px;padding:14px;color:#fff}
.ov-kpi.pur{background:linear-gradient(135deg,#5B21B6,#7C3AED)}
.ov-kpi.gol{background:linear-gradient(135deg,#F59E0B,#F97316)}
.ov-kpi .l{font-size:12.5px;opacity:.9}
.ov-kpi .v{font-size:30px;font-weight:900;margin:4px 0}
.ov-kpi .t{font-size:12px;opacity:.85}
.ov-layout{display:grid;grid-template-columns:5fr 4fr 4fr;gap:14px;margin-top:14px;align-items:start}
.ov-stack{display:grid;gap:14px}
.ov-hero{background:linear-gradient(135deg,#5B21B6,#7C3AED);border-radius:16px;padding:18px;color:#fff;position:relative}
.ov-hero h2{color:#FFD34D;font-family:Georgia,serif;font-style:italic;font-size:26px;margin:0 0 6px}
.ov-hero p{margin:0 0 10px;line-height:1.5;padding-right:170px}
.ov-hero .chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px;padding-right:170px}
.ov-hero .chips span{border:1px solid rgba(255,255,255,.45);border-radius:20px;padding:4px 10px;font-size:12.5px}
.ov-hero .hero-photo{width:150px;height:120px;object-fit:cover;border-radius:12px;border:2px solid rgba(255,255,255,.6);position:absolute;right:16px;top:64px}
.ov-hero .hero-edit{position:absolute;top:12px;right:12px;background:linear-gradient(135deg,#FDE68A,#F59E0B);color:#3B1A7A;border-radius:50%;width:30px;height:30px;display:flex;align-items:center;justify-content:center;font-size:15px;box-shadow:0 2px 8px rgba(0,0,0,.4);border:0}
.ov-btn-gold{background:linear-gradient(135deg,#FDE68A,#F59E0B);color:#3B1A7A;border:0;border-radius:9px;padding:9px 14px;font-weight:800}
.ov-btn-ghost{background:transparent;color:#fff;border:1px solid rgba(255,255,255,.6);border-radius:9px;padding:8px 12px;font-weight:700}
.ov-btn{display:inline-block;border-radius:9px;padding:8px 12px;font-weight:700;border:1px solid var(--line);background:#3A2866;color:var(--ink)}
.ov-edit{background:transparent;border:1px solid var(--gold2);color:var(--gold);border-radius:20px;padding:3px 10px;font-size:12px;font-weight:700}

<script>
"use strict";
/* Safe Deli Unified Dashboard — single file, no demo data.
   Every number, name and row comes from the API. Empty states are
   shown honestly when the API returns nothing. Login token is saved
   in localStorage on this device (Min asked 2026-11-18) so a refresh
   keeps the login; logout clears it. The server session still
   expires 12h after login. */
let TOKEN = null, ME = null, CURRENT_VIEW = null, LAST_TABLE_ROWS = [];
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmtNum = n => (n == null || isNaN(n)) ? "—" : Number(n).toLocaleString("en-US");
const fmtMoney = (n, cur) => {
  if (n == null || isNaN(n)) return "—";
  const v = Number(n).toLocaleString("en-US", {maximumFractionDigits: 2});
  return cur === "MMK" ? v + " Ks" : "฿" + v;
};
const fmtDate = s => {
  if (!s) return "—";
  const d = new Date(s);
  return isNaN(d) ? esc(s) : d.toLocaleString("en-GB", {day:"2-digit", month:"short", hour:"2-digit", minute:"2-digit"});
};
const statusPill = st => {
  const m = {pending:["grey","st.pending"], new:["blue","st.new"], confirmed:["blue","st.confirmed"],
    shop_confirmed:["green","st.shop_confirmed"], shop_rejected:["red","st.shop_rejected"],
    preparing:["amber","st.preparing"], delivering:["blue","st.delivering"], delivered:["green","st.delivered"],
    cancelled:["red","st.cancelled"], failed:["red","st.failed"], completed:["green","st.completed"],
    processing:["amber","st.processing"], shipped:["blue","st.shipped"], active:["green","st.active"],
    approved:["green","st.approved"], suspended:["red","st.suspended"], rejected:["red","st.rejected"],
    verified:["green","st.verified"], assigned:["blue","st.assigned"], accepted:["blue","st.accepted"],
    picked_up:["blue","st.picked_up"], created:["grey","st.created"]};
  const p = m[st] || ["grey", st || "—"];
  return `<span class="pill ${p[0]}">${esc(m[st] ? t(p[1]) : p[1])}</span>`;
};
async function api(path, opts) {
  opts = opts || {};
  const res = await fetch(path, {
    method: opts.method || "GET",
    headers: Object.assign({"Accept": "application/json"},
      opts.body ? {"Content-Type": "application/json"} : {},
      TOKEN ? {"Authorization": "Bearer " + TOKEN} : {}),
    body: opts.body ? JSON.stringify(opts.body) : undefined
  });
  const ct = res.headers.get("content-type") || "";
  const data = ct.includes("application/json") ? await res.json().catch(() => ({})) : {};
  if (!res.ok) {
    const err = new Error((data && data.error) || ("HTTP " + res.status));
    err.status = res.status; throw err;
  }
  return data;
}
async function apiCsv(path, filename) {
  const res = await fetch(path, {headers: TOKEN ? {"Authorization": "Bearer " + TOKEN} : {}});
  if (!res.ok) throw new Error("HTTP " + res.status);
  const blob = await res.blob();
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = filename; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 5000);
}
function donut(parts, total, centerTop, centerSub) {
  // parts: [{label, value, color}] — pure CSS conic-gradient donut.
  if (!total) return `<div class="donut-wrap"><div class="donut" style="background:#EDE9FE"><div class="center"><b>0</b><span>${esc(centerSub || "")}</span></div></div><ul class="legend"><li>${esc(t("common.empty"))}</li></ul></div>`;
  let acc = 0; const stops = parts.map(p => {
    const from = acc / total * 360, to = (acc + p.value) / total * 360; acc += p.value;
    return `${p.color} ${from}deg ${to}deg`;
  }).join(", ");
  const rows = parts.map(p => `<li><span class="sw" style="background:${p.color}"></span>${esc(p.label)}<b>${fmtNum(p.value)} (${Math.round(p.value / total * 100)}%)</b></li>`).join("");
  return `<div class="donut-wrap"><div class="donut" style="background:conic-gradient(${stops})"><div class="center"><b>${esc(centerTop)}</b><span>${esc(centerSub || "")}</span></div></div><ul class="legend">${rows}</ul></div>`;
}
function barchart(chart) {
  if (!chart || !chart.length) return `<div class="empty">${esc(t("common.empty"))}</div>`;
  const max = Math.max.apply(null, chart.map(c => c.income || 0).concat([1]));
  const cols = chart.map(c => {
    const h = Math.max(2, Math.round((c.income || 0) / max * 110));
    const d = (c.date || "").slice(5);
    return `<div class="bar-col" title="${esc(c.date || "")} — ฿${fmtNum(c.income || 0)} • ${esc(t("common.ordersN").replace("{n}", String(c.orders || 0)))}"><div class="v">${fmtNum(c.income || 0)}</div><div class="bar" style="height:${h}px"></div><div class="d">${esc(d)}</div></div>`;
  }).join("");
  return `<div class="bars">${cols}</div>`;
}
function tableOrEmpty(head, rowsHtml) {
  if (!rowsHtml) return `<div class="empty">${esc(t("common.empty"))}</div>`;
  return `<div class="tbl-wrap"><table><thead><tr>${head}</tr></thead><tbody>${rowsHtml}</tbody></table></div>`;
}
function showErr(el, err) { if (el) el.textContent = t("common.err") + " — " + (err.message || err); }

    if (!Ctx) return;
    const ctx = new Ctx();
    const o = ctx.createOscillator(); const g = ctx.createGain();
    o.connect(g); g.connect(ctx.destination);
    o.frequency.value = 880; g.gain.value = 0.15;
    o.start(); g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.4);

const NAV_ICONS = {overview:"📊", orders:"🛒", reviews:"⭐", shops:"🏪", products:"📦", homeDishes:"🍜", customers:"👥", delivery:"🚚", riders:"🛵", finance:"💰", media:"🖼️", settings:"⚙️", users:"👤", audit:"📋", moverview:"🏪", morders:"🛒", mproducts:"📦", payouts:"💸", prefs:"⚙️", account:"👤", categories:"🗂️", coin:"🪙", game:"🎮", banners:"🏷️", reports:"📊"};
let NAV_BADGES = {};
async function refreshNavBadges() {
  try {
    const s = await api("/api/admin/dashboard/summary");
    const d = await api("/api/admin/home-dishes").catch(() => ({dishes: []}));
    const st = await api("/api/admin/settings").catch(() => ({}));
    const set = st.settings || st;
    NAV_BADGES = {
      orders: s.orders ? s.orders.total : null,
      shops: s.shops ? s.shops.total : null,
      dishes: (d.dishes || []).length,
      cats: HOME_DISH_CATS.length,
      customers: null, reviews: null,
      banners: Array.isArray(set.banners) ? set.banners.length : 0
    };
    try { const c = await api("/api/admin/customers?limit=1"); NAV_BADGES.customers = (c.total !== undefined ? c.total : (c.customers || []).length); } catch (e) {}
    try { const r = await api("/api/admin/reviews?limit=1"); NAV_BADGES.reviews = (r.total !== undefined ? r.total : (r.reviews || []).length); } catch (e) {}
    if (document.querySelector("#navMenu")) renderNav();
  } catch (e) {}
}
function navFor(role) { return (role === "merchant" ? MERCHANT_NAV : ADMIN_NAV).filter(n => n.roles.includes(role)); }
function renderNav() {
  const nav = navFor(ME.role);
  let html = "";
  nav.forEach(n => {
    if (n.sect) html += `<div class="sect">${esc(t(n.sect))}</div>`;
    const badge = NAV_BADGES[n.badge];
    const tag = n.soon ? `<span class="soon">${esc(t("nav.soon"))}</span>`
      : (badge !== undefined && badge !== null ? `<span class="badge">${esc(String(badge))}</span>` : "");
    html += `<button data-view="${n.id}" class="${CURRENT_VIEW === n.id ? "active" : ""}"><span class="ic">${NAV_ICONS[n.id] || "•"}</span>${esc(t("nav." + n.id))} ${tag}</button>`;
  });
  $("#navMenu").innerHTML = html
    + `<div class="sect">${esc(t("nav.account"))}</div>`
    + `<button data-view="__me"><span class="ic">👤</span>${esc(ME.display_name || ME.username)}</button>`;
  $("#navMenu").querySelectorAll("button[data-view]").forEach(b => b.addEventListener("click", () => {
    if (b.dataset.view === "__me") { showView("overview"); return; }
    $("#sidebar").classList.remove("open"); showView(b.dataset.view);
  }));
  $("#rolePill").textContent = {owner:"Owner", finance:"Finance", support:"Support", operations:"Operations", merchant:"Merchant"}[ME.role] || ME.role;
  $("#userName").textContent = ME.display_name || ME.username;
  $("#sideFoot").innerHTML = `<div class="status-card"><div class="status-t">Platform Status</div>
      <div class="status-row"><span><span class="dot"></span>API</span><b class="ok">Online</b></div>
      <div class="status-row"><span><span class="dot"></span>Dashboard</span><b class="ok">Online</b></div>
      <div class="status-row"><span>Safe Deli v1.0.0 (Owner)</span></div></div>`;
}
async function showView(id) {
  if (!VIEWS[id]) id = "overview";
  CURRENT_VIEW = id;
  renderNav();
  const v = $("#view");
  v.innerHTML = `<div class="card"><div class="empty">${esc(t("common.loading"))}</div></div>`;
  try { await VIEWS[id](v); }
  catch (e) { v.innerHTML = `<div class="card"><h1>${esc(t("common.errTitle"))}</h1><p class="err-text">${esc(e.message || e)}</p></div>`; }
  applySearchFilter();
}
function head(title, sub, extra) {
  return `<div class="view-head"><div><h1>${esc(title)}</h1><div class="muted">${esc(sub || "")}</div></div><div class="spacer"></div>${extra || ""}</div>`;
}

function ovMapPct(lat, lon) {
  // Same crop as the preview map: z17, tiles x 101904-101906, y 57925-57926, crop (77,168,589,368).
  const z = 17, n = 1 << z;
  const x = (lon + 180) / 360 * n;
  const la = lat * Math.PI / 180;
  const y = (1 - Math.log(Math.tan(la) + 1 / Math.cos(la)) / Math.PI) / 2 * n;
  const px = x * 256 - 101904 * 256, py = y * 256 - 57925 * 256;
  const cx = (px - 77) / 512 * 100, cy = (py - 168) / 200 * 100;
  if (cx < 0 || cx > 100 || cy < 0 || cy > 100) return null;
  return {x: cx.toFixed(1), y: cy.toFixed(1)};
}
let OV_CAR = {items: [], i: 0};
function ovCarRender() {
  const img = document.getElementById("ovCarImg");
  if (!img || !OV_CAR.items.length) return;
  const it = OV_CAR.items[OV_CAR.i];
  img.src = it.image_url || it.image || "";
  img.alt = it.title || "";
  const cap = document.getElementById("ovCarCap");
  if (cap) cap.textContent = "Slide " + (OV_CAR.i + 1) + " / " + OV_CAR.items.length + " — " + (it.title || "");
  document.querySelectorAll("#ovCarDots span").forEach((d, k) => d.classList.toggle("on", k === OV_CAR.i));
}
function ovCarGo(d) { if (!OV_CAR.items.length) return; OV_CAR.i = (OV_CAR.i + d + OV_CAR.items.length) % OV_CAR.items.length; ovCarRender(); }
function ovCarSet(k) { OV_CAR.i = k; ovCarRender(); }
async function ovDishSave(id, fields) {
  try { await api("/api/admin/home-dishes/" + id, {method: "PUT", body: fields}); }
  catch (e) { showView("overview"); }
}
async function ovDishMove(id, dir) {
  const d = await api("/api/admin/home-dishes").catch(() => ({dishes: []}));
  const dishes = d.dishes || [];
  const i = dishes.findIndex(x => x.id === id);
  const j = i + dir;
  if (i < 0 || j < 0 || j >= dishes.length) return;
  await api("/api/admin/home-dishes/" + dishes[j].id, {method: "PUT", body: {sort_order: dishes[i].sort_order}});
  await api("/api/admin/home-dishes/" + dishes[i].id, {method: "PUT", body: {sort_order: dishes[j].sort_order}});
  showView("overview");
}
async function ovDishDel(id) {
  if (!confirm(t("common.confirmDelete") || "Delete?")) return;
  await api("/api/admin/home-dishes/" + id, {method: "DELETE"});
  showView("overview");
}

/* ---------- Categories (dish categories, real counts) ---------- */
async function viewCategories(v) {
  const d = await api("/api/admin/home-dishes").catch(() => ({dishes: []}));
  const dishes = d.dishes || [];
  const catCount = {};
  dishes.forEach(x => { catCount[x.category] = (catCount[x.category] || 0) + 1; });
  const circles = HOME_DISH_CATS.map((c, i) => {
    const first = dishes.find(x => x.category === c.id);
    const photo = first && first.image_url ? `<img src="${esc(first.image_url)}" alt="">` : `<div class="ph ${i % 2 ? "gol" : "pur"}">${esc(c.name.trim().charAt(0))}</div>`;
    return `<div class="ov-cat"><a href="javascript:void(0)" onclick="document.querySelectorAll('#catList .ov-cat').forEach(e=>e.style.opacity=.55);this.closest('.ov-cat').style.opacity=1;document.getElementById('catDetail').innerHTML=window.__catDetail('${c.id}')">${photo}</a><div class="nm">${esc(c.name)}</div><div class="cnt">${esc(t("cat.dishesN").replace("{n}", fmtNum(catCount[c.id] || 0)))}</div></div>`;
  }).join("");
  window.__catDetail = (cid) => {
    const rows = dishes.filter(x => x.category === cid).map(x => `<div class="ov-rail-row"><div><div class="nm">${esc(x.name)}</div><div class="sub">${esc(homeDishCatName(x.category))} • ${x.price !== null && x.price !== undefined ? "฿" + fmtNum(x.price) : esc(t("ov2.dishNoPrice"))}</div></div><span class="pill ${x.is_available ? "green" : "grey"}">${esc(x.is_available ? t("ov2.openNow") : t("ov2.closedNow"))}</span></div>`).join("");
    return rows || `<div class="empty">${esc(t("common.empty"))}</div>`;
  };
  v.innerHTML = head(t("cat.t"), t("cat.s"))
    + `<div class="card"><div class="ov-cats" id="catList">${circles}</div><div id="catDetail" style="margin-top:14px"></div>
      <div style="margin-top:14px"><button class="btn" onclick="showView('homeDishes')">${esc(t("cat.viewDishes"))}</button></div></div>`;
}

    const j = i + dir;
    if (j < 0 || j >= banners.length) return;
    const tmp = banners[i]; banners[i] = banners[j]; banners[j] = tmp;
    banners.forEach((b, k) => { b.sort_order = k + 1; });
    await window.__banSaveAll(banners);
  };
  window.__banDel = async (i) => {
    if (!confirm(t("common.confirmDelete") || "Delete?")) return;
    banners.splice(i, 1);

    const img = (document.getElementById("banImg") || {}).value || "";

  };
  window.__banExport = () => {
    /* v19.37: the app reads banners.json from GitHub Pages, so the
       dashboard's banners reach the app only after this file is
       uploaded to the repo as banners.json. */
    const list = banners.map((b, k) => ({image_url: b.image_url || "", link_url: b.link_url || null, title: b.title || "", sort_order: k + 1, is_active: true}));
    const blob = new Blob([JSON.stringify({banners: list}, null, 2)], {type: "application/json"});
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "banners.json";
    document.body.appendChild(a);
    a.click();
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
  };
  v.innerHTML = head(t("ban.t"), t("ban.s"))
    + `<div class="card"><h2>${esc(t("ban.t"))}</h2>
      ${banners.length ? rows : `<div class="empty">${esc(t("ban.empty"))}</div>`}

        <div><label class="flabel">${esc(t("ban.titlePh"))}</label><input id="banTitle"></div>
        <div><label class="flabel">${esc(t("ban.linkPh"))}</label><input id="banLink" placeholder="https://…"></div>
        <div class="full" style="display:flex;gap:8px;flex-wrap:wrap">
          <button class="btn" onclick="window.__banAdd()">${esc(t("ban.add"))}</button>
          <button class="btn gold" onclick="window.__banExport()">${esc(t("ban.export"))}</button>
          <label class="btn ghost" style="display:inline-flex;align-items:center;gap:6px">${esc(t("ban.upload"))}<input type="file" id="banFile" accept="image/*" style="display:none"></label>
        </div></div>
      <div class="err-text" id="banErr"></div><div class="ok-text" id="banOk"></div>
      <p class="muted small" style="margin-top:10px">${esc(t("ov2.promoNote"))}</p></div>`;
  const fi = document.getElementById("banFile");
  if (fi) fi.addEventListener("change", async () => {
    const f = fi.files && fi.files[0];
    if (!f) return;
    const fd = new FormData();
    fd.append("kind", "product");
    fd.append("file", f);
    try {
      const r = await apiUpload("/api/admin/media", fd);
      document.getElementById("banImg").value = r.url || "";
      document.getElementById("banOk").textContent = t("ban.saved");
    } catch (e) { document.getElementById("banErr").textContent = uploadErrText(e); }
  });
}

/* ---------- Shop form helpers (2026-11-13 rebuild) ----------
   AM/PM time picker (no typing — the old typed "7:00" was rejected by
   the API), Maps-link coordinate parsing, and plain-Burmese error text
   so the API's technical English never reaches the user raw. ---------- */
function timePickerHTML(prefix) {
  const hours = Array.from({length: 12}, (_, i) => `<option value="${i + 1}">${i + 1}</option>`).join("");
  const mins = [0, 5, 10, 15, 20, 25, 30, 35, 40, 45, 50, 55]
    .map(m => `<option value="${String(m).padStart(2, "0")}">${String(m).padStart(2, "0")}</option>`).join("");
  return `<div class="time-picker"><select id="${prefix}H" aria-label="hour">${hours}</select><select id="${prefix}M" aria-label="minute">${mins}</select><select id="${prefix}AP" aria-label="AM/PM"><option value="AM">AM</option><option value="PM">PM</option></select></div>`;
}
function timePickerRead(prefix) {
  const h12 = Number($("#" + prefix + "H").value);
  const min = $("#" + prefix + "M").value;
  const ap = $("#" + prefix + "AP").value;
  let h24 = h12 % 12; if (ap === "PM") h24 += 12;
  return String(h24).padStart(2, "0") + ":" + min;
}
function timePickerSet(prefix, hhmm) {
  const m = /^(\d{2}):(\d{2})$/.exec(hhmm || "");
  const hourSel = $("#" + prefix + "H"), minSel = $("#" + prefix + "M"), apSel = $("#" + prefix + "AP");
  if (!m || !hourSel || !minSel || !apSel) return;
  let h = Number(m[1]); const minStr = String(Number(m[2])).padStart(2, "0");
  const ap = h >= 12 ? "PM" : "AM";
  let h12 = h % 12; if (h12 === 0) h12 = 12;
  hourSel.value = String(h12);
  // Keep a non-5-minute value (e.g. 07:03 from an old shop) instead of
  // silently rounding it away.
  if (![...minSel.options].some(o => o.value === minStr)) {
    const opt = document.createElement("option");
    opt.value = minStr; opt.textContent = minStr; minSel.appendChild(opt);
  }
  minSel.value = minStr;
  apSel.value = ap;
}
function parseMapsLink(url) {
  if (!url) return null;
  let m = /@(-?\d+(?:\.\d+)?),(-?\d+(?:\.\d+)?)/.exec(url);
  if (m) return {lat: Number(m[1]), lon: Number(m[2])};
  m = /[?&](?:q|ll)=(-?\d+(?:\.\d+)?),(-?\d+(?:\.\d+)?)/.exec(url);
  if (m) return {lat: Number(m[1]), lon: Number(m[2])};
  m = /!3d(-?\d+(?:\.\d+)?)!4d(-?\d+(?:\.\d+)?)/.exec(url);
  if (m) return {lat: Number(m[1]), lon: Number(m[2])};
  return null; // Short links (maps.app.goo.gl) carry no coordinates —
  // the GPS fields stay as they are; the save is not blocked.
}
function shopUrlList(value) {
  return (value || "").split("\n").map(s => s.trim()).filter(Boolean);
}
// API error message (prefix) -> plain-Burmese i18n key. Anything
// unrecognised falls back to the generic plain message — never raw.
const SHOP_ERRS = [
  ["Shop name is required", "sh.err.name"],
  ["Category must be an enabled shop type", "sh.err.category"],
  ["Shop address is required", "sh.err.address"],
  ["Shop phone is required", "sh.err.phone"],

  ["open_time must use HH:MM", "sh.err.time"],
  ["open_time and close_time must be provided together or both be null", "sh.err.time"],
  ["Opening and closing times must differ", "sh.err.sameTime"],
  ["maps_url must be a valid Maps link", "sh.err.url"],
  ["video_url must be a valid HTTPS URL", "sh.err.url"],
  ["menu_url must be a valid HTTPS URL", "sh.err.url"],
  ["photo_url must be a valid HTTPS URL", "sh.err.url"],
  ["photo_urls must be a list of HTTPS URLs", "sh.err.url"],
  ["interior_photo_urls must be a list of HTTPS URLs", "sh.err.url"],
  ["Shop not found", "sh.err.notFound"],

  ["Shop has orders", "sh.err.hasOrders"],
  ["Shop has a merchant account", "sh.err.hasMerchant"],
];
function shopErrText(err) {
  const msg = (err && err.message) || "";
  const hit = SHOP_ERRS.find(([prefix]) => msg.indexOf(prefix) === 0);
  return hit ? t(hit[1]) : t("sh.err.generic");
}
function shopErr(el, err) { if (el) el.textContent = shopErrText(err); }
function shopErrKey(el, key) { if (el) el.textContent = t(key); }

// --- Shop media upload (2026-11-13): pick a photo/video from the
// phone's files, upload it, and the URL fills itself in + a preview
// appears. No links needed. The URL field stays as a fallback.
async function apiUpload(path, formData) {
  // FormData sets its own multipart Content-Type (with boundary), so
  // no Content-Type header here — unlike api(), which sends JSON.
  const res = await fetch(path, {
    method: "POST",
    headers: TOKEN ? {"Authorization": "Bearer " + TOKEN} : {},
    body: formData
  });
  const ct = res.headers.get("content-type") || "";
  const data = ct.includes("application/json") ? await res.json().catch(() => ({})) : {};
  if (!res.ok) {
    const err = new Error((data && data.error) || ("HTTP " + res.status));
    err.status = res.status; throw err;
  }
  return data;
}
function uploadErrText(err) {
  const msg = (err && err.message) || "";
  if (msg.indexOf("Only JPG, PNG or WebP") === 0) return t("sh.up.badType");
  if (msg.indexOf("Only MP4, WebM or MOV") === 0) return t("sh.up.badVideo");
  if (msg.indexOf("File is too large") === 0) {
    return (msg.indexOf("100 MB") >= 0) ? t("sh.up.videoTooBig") : t("sh.up.tooBig");
  }
  return t("sh.up.failed");
}
function mediaThumb(url, isVideo, isNew) {
  // The picture sits inside the app's gold frame (same style as the
  // shop-photo and Menu dish cards) — never a bare thumbnail.
  const inner = isVideo
    ? `<video src="${esc(url)}" controls preload="metadata" playsinline></video>`
    : `<img src="${esc(url)}" alt="">`;
  const badge = isNew ? `<span class="new-badge">NEW</span>` : "";
  return `<div class="frame-gold">${inner}${badge}</div>`;
}
// Is the menu in the form NEW (fresh, within the NEW window)? Set
// from the shop being edited, or when a new menu is uploaded here.
let menuIsNew = false;
function renderMediaThumbs() {
  // Show the pictures already in the fields (edit mode, or a link
  // pasted by hand), so Min can SEE them before saving.
  const set = (el, urls, isVideo, isNew) => { if (el) el.innerHTML = urls.filter(Boolean).map(u => mediaThumb(u, isVideo, isNew)).join(""); };
  set($("#shPhotoThumb"), [$("#shPhoto") ? $("#shPhoto").value.trim() : ""], false, false);
  set($("#shPhotosThumb"), shopUrlList($("#shPhotos") ? $("#shPhotos").value : ""), false, false);
  set($("#shInteriorThumb"), shopUrlList($("#shInterior") ? $("#shInterior").value : ""), false, false);
  set($("#shMenuThumb"), [$("#shMenu") ? $("#shMenu").value.trim() : ""], false, menuIsNew);
  set($("#shVideoThumb"), [$("#shVideo") ? $("#shVideo").value.trim() : ""], true, false);
}
function bindUpload(fileInputId, kind, isVideo, applyUrl, statusId, thumbId) {
  const input = $(fileInputId);
  if (!input) return;
  input.addEventListener("change", async () => {
    const files = Array.from(input.files || []);
    input.value = "";
    if (!files.length) return;
    const status = $(statusId), thumb = $(thumbId);
    for (const file of files) {
      if (status) status.textContent = t("sh.up.uploading");
      // Show the picked file at once (local preview) while it uploads.
      // Single photo/video: replace the frame. Photo lists: add a frame.
      let localUrl = null;
      try { localUrl = URL.createObjectURL(file); } catch (e) {}
      if (localUrl && thumb) {
        if (input.multiple) thumb.insertAdjacentHTML("beforeend", mediaThumb(localUrl, isVideo));
        else thumb.innerHTML = mediaThumb(localUrl, isVideo);
      }
      const fd = new FormData();
      fd.append("kind", kind);
      fd.append("file", file);
      try {
        const r = await apiUpload("/api/admin/media", fd);
        if (localUrl) { try { URL.revokeObjectURL(localUrl); } catch (e) {} }
        await applyUrl(r.url);
        if (status) status.textContent = t("sh.up.done");
        renderMediaThumbs();
      } catch (e) {
        if (localUrl) { try { URL.revokeObjectURL(localUrl); } catch (e2) {} }
        if (status) status.textContent = uploadErrText(e);
        // Leave the picked picture visible (do not re-render): Min
        // can SEE it is the right photo and pick it again to retry.
      }
    }
  });
}

        <div><label class="flabel">${esc(t("sh.f.close"))}</label>${timePickerHTML("close")}</div>
        <div class="form-sec">${esc(t("sh.sec.media"))} <span class="muted">${esc(t("sh.sec.mediaSub"))}</span></div>
        <div class="full"><label class="flabel">${esc(t("sh.f.photo"))} ${esc(t("app.optional"))}</label><input id="shPhoto" type="hidden"><div class="muted small">${esc(t("sh.up.photoWhere"))}</div><div class="up-row"><input id="shPhotoFile" type="file" accept="image/*"></div><div class="muted small">${esc(t("sh.up.hint"))}</div><div class="thumb thumb-single" id="shPhotoThumb"></div><div class="up-status" id="shPhotoStatus"></div></div>
        <div class="full"><label class="flabel">${esc(t("sh.f.photos"))} ${esc(t("app.optional"))}</label><input id="shPhotos" type="hidden"><div class="up-row"><input id="shPhotosFile" type="file" accept="image/*" multiple></div><div class="muted small">${esc(t("sh.up.hint"))}</div><div class="thumb thumb-grid" id="shPhotosThumb"></div><div class="up-status" id="shPhotosStatus"></div></div>
        <div class="full"><label class="flabel">${esc(t("sh.f.interior"))} ${esc(t("app.optional"))}</label><input id="shInterior" type="hidden"><div class="up-row"><input id="shInteriorFile" type="file" accept="image/*" multiple></div><div class="muted small">${esc(t("sh.up.hint"))}</div><div class="thumb thumb-grid" id="shInteriorThumb"></div><div class="up-status" id="shInteriorStatus"></div></div>
        <div class="full"><label class="flabel">${esc(t("sh.f.video"))} ${esc(t("app.optional"))}</label><input id="shVideo" type="hidden"><div class="up-row"><input id="shVideoFile" type="file" accept="video/*"></div><div class="muted small">${esc(t("sh.up.videoHint"))}</div><div class="thumb thumb-single" id="shVideoThumb"></div><div class="up-status" id="shVideoStatus"></div></div>
        <div class="full"><label class="flabel">${esc(t("sh.f.menu"))} ${esc(t("app.optional"))}</label><input id="shMenu" type="hidden"><div class="up-row"><input id="shMenuFile" type="file" accept="image/*"></div><div class="muted small">${esc(t("sh.up.hint"))}</div><div class="thumb thumb-single" id="shMenuThumb"></div><div class="up-status" id="shMenuStatus"></div></div>

      </div><div class="muted small" style="margin-top:8px">${t("sh.gpsHint")}</div><div class="err-text" id="shErr"></div><div class="ok-text" id="shOk"></div>` : ""}

  // Pasting a Maps link fills the GPS pin from its coordinates.
  const shMaps = $("#shMaps");
  if (shMaps) shMaps.addEventListener("change", () => {
    const p = parseMapsLink(shMaps.value.trim());
    if (p) { $("#shLat").value = p.lat; $("#shLon").value = p.lon; }
  });
  // Media upload: pick a photo/video from the phone's files — no link
  // box (Min 2026-11-13: links are not wanted). The uploaded URL is
  // kept in a hidden field and a preview appears in the gold frame.
  // A fresh form starts with no NEW menu.
  menuIsNew = false;
  bindUpload("#shPhotoFile", "shop", false, url => { $("#shPhoto").value = url; }, "#shPhotoStatus", "#shPhotoThumb");
  bindUpload("#shPhotosFile", "shop", false, url => { const ta = $("#shPhotos"); ta.value = (ta.value.trim() ? ta.value.trim() + "\n" : "") + url; }, "#shPhotosStatus", "#shPhotosThumb");
  bindUpload("#shInteriorFile", "interior", false, url => { const ta = $("#shInterior"); ta.value = (ta.value.trim() ? ta.value.trim() + "\n" : "") + url; }, "#shInteriorStatus", "#shInteriorThumb");
  bindUpload("#shMenuFile", "menu", false, url => { $("#shMenu").value = url; menuIsNew = true; }, "#shMenuStatus", "#shMenuThumb");
  bindUpload("#shVideoFile", "video", true, url => { $("#shVideo").value = url; }, "#shVideoStatus", "#shVideoThumb");
  v.querySelectorAll("[data-sh-edit]").forEach(b => b.addEventListener("click", async () => {
    const s = (d.shops || []).find(x => String(x.id) === b.dataset.shEdit);
    if (!s) return;
    // Hours first: if they cannot be loaded, say so and do NOT open
    // the form — opening it with default hours would silently
    // overwrite the shop's real hours on save.
    let h;
    try { h = await api(`/api/admin/shops/${s.id}/hours`); }
    catch (e) { shopErr($("#shErr"), e); return; }
    shEditId = s.id;
    $("#shName").value = s.name || ""; $("#shType").value = s.category || "";
    $("#shAddr").value = s.address || ""; $("#shPhone").value = s.phone || "";
    $("#shLat").value = s.latitude != null ? s.latitude : ""; $("#shLon").value = s.longitude != null ? s.longitude : "";
    // New/media fields — the admin list now returns them all.
    $("#shMaps").value = s.maps_url || "";
    $("#shPhoto").value = s.photo_url || "";
    $("#shPhotos").value = (s.photo_urls || []).join("\n");
    $("#shInterior").value = (s.interior_photo_urls || []).join("\n");
    $("#shVideo").value = s.video_url || "";
    $("#shMenu").value = s.menu_url || "";

    timePickerSet("open", h.open_time || "06:00"); timePickerSet("close", h.close_time || "22:00");
    $("#shFormTitle").textContent = t("sh.formEdit").replace("{n}", s.name || "");
    $("#shSave").textContent = t("common.save"); $("#shCancel").classList.remove("hidden");

  }));
  v.querySelectorAll("[data-sh-toggle]").forEach(b => b.addEventListener("click", async () => {
    const toStatus = b.dataset.shStatus;
    if (toStatus === "suspended" && !confirm(t("sh.confirmSuspend"))) return;
    try { await api(`/api/admin/shops/${b.dataset.shToggle}`, {method: "PUT", body: {status: toStatus}}); showView("shops"); }
    catch (e) { shopErr($("#shErr"), e); }
  }));
  // --- True delete (owner only, 2026-11-18): removes the shop for good.
  // The server blocks it when the shop has orders or a linked merchant
  // account; those errors surface via shopErr, like the other shop errors.
  v.querySelectorAll("[data-sh-delete]").forEach(b => b.addEventListener("click", async () => {
    if (!confirm(t("sh.confirmDelete"))) return;
    try { await api(`/api/admin/shops/${b.dataset.shDelete}`, {method: "DELETE"}); showView("shops"); }
    catch (e) { shopErr($("#shErr"), e); }
  }));
  // --- Per-shop open/close (owner only, manual + immediate, any time, no schedule) ---
  v.querySelectorAll("[data-sh-oc]").forEach(b => b.addEventListener("click", async () => {

      await api(`/api/admin/shops/${b.dataset.shOc}`, {method: "PUT", body: {is_open: toOpen}});
    } catch (e) { shopErr($("#shErr"), e); return; }
    showView("shops");
  }));
  const shSave = $("#shSave");
  if (shSave) shSave.addEventListener("click", async () => {
    // Double-submit guard (2026-11-13): extra taps on Add created
    // duplicate shops. The button is disabled while a save is in
    // flight, and the server dedupes identical replays by name+phone.
    if (shSaving) return;
    const errEl = $("#shErr"); if (errEl) errEl.textContent = "";
    const name = $("#shName").value.trim(), addr = $("#shAddr").value.trim(), phone = $("#shPhone").value.trim();
    if (!name) { shopErrKey(errEl, "sh.err.name"); return; }
    if (!addr) { shopErrKey(errEl, "sh.err.address"); return; }
    if (!phone) { shopErrKey(errEl, "sh.err.phone"); return; }
    const open = timePickerRead("open"), close = timePickerRead("close");
    if (open === close) { shopErrKey(errEl, "sh.err.sameTime"); return; }
    const body = {name, category: $("#shType").value, address: addr, phone,
      maps_url: $("#shMaps").value.trim() || null,
      photo_url: $("#shPhoto").value.trim() || null,
      photo_urls: shopUrlList($("#shPhotos").value),
      interior_photo_urls: shopUrlList($("#shInterior").value),
      video_url: $("#shVideo").value.trim() || null,
      menu_url: $("#shMenu").value.trim() || null};
    const lat = $("#shLat").value.trim(), lon = $("#shLon").value.trim();
    if (lat !== "" && lon !== "") { body.latitude = Number(lat); body.longitude = Number(lon); }
    shSaving = true; shSave.disabled = true; shSave.textContent = t("sh.saving");
    try {
      let shopId = shEditId;
      if (shEditId) { await api(`/api/admin/shops/${shEditId}`, {method: "PUT", body}); }
      else { const r = await api("/api/admin/shops", {method: "POST", body}); shopId = r.shop_id; }
      // Hours are always saved with the shop (the picker always yields
      // both values), so a shop can never be left hour-less by mistake.
      await api(`/api/admin/shops/${shopId}/hours`, {method: "PUT", body: {open_time: open, close_time: close}});
      showView("shops");
    } catch (e) { shopErr(errEl, e); }
    finally { shSaving = false; shSave.disabled = false; shSave.textContent = shEditId ? t("common.save") : t("sh.add"); }
  });
  const shCancel = $("#shCancel");
  if (shCancel) shCancel.addEventListener("click", () => showView("shops"));
}

/* ---------- Products ---------- */
async function viewProducts(v) {
  const d = await api("/api/admin/products?limit=50");
  const canEdit = ["owner", "finance"].includes(ME.role);
  const products = d.products || [];
  // Grouped, one section per group (Min 2026-11-13: keep it simple —
  // group + order, each dish in its own group, never mixed). The API
  // already returns them grouped + ordered (group, sort_order).
  const groups = [];
  for (const p of products) {
    const g = p.group_name || "Food";
    let sec = groups.find(x => x.name === g);
    if (!sec) { sec = {name: g, items: []}; groups.push(sec); }
    sec.items.push(p);
  }
  const sectionHtml = groups.map(sec => {
    const rows = sec.items.map((p, i) => {
      const photo = p.image_url
        ? `<div class="frame-gold prod-frame"><img src="${esc(p.image_url)}" alt=""></div>`
        : `<div class="frame-gold prod-frame"></div>`;
      const moveBtns = canEdit
        ? `<button class="btn sm" data-prod-up="${p.id}" ${i === 0 ? "disabled" : ""} aria-label="up">↑</button> <button class="btn sm" data-prod-down="${p.id}" ${i === sec.items.length - 1 ? "disabled" : ""} aria-label="down">↓</button>`
        : "";
      return `<tr><td data-lbl=""><div id="pt-${p.id}">${photo}</div>${canEdit ? `<div class="up-row"><input id="pf-${p.id}" type="file" accept="image/*" data-prod-photo="${p.id}"></div><div class="up-status" id="ps-${p.id}"></div>` : ""}</td>
      <td data-lbl="${esc(t("prod.th.product"))}"><b>${esc(p.name)}</b><br><span class="muted small">${esc(p.description || "")}</span><br><span class="muted small">${esc(p.shop_name || ("#" + p.shop_id))}</span></td>
      <td data-lbl="${esc(t("prod.th.price"))}">${p.price != null ? "฿" + fmtNum(p.price) : "—"}</td>
      <td data-lbl="${esc(t("ov.th.status"))}">${p.is_available ? `<span class="pill green">${esc(t("prod.available"))}</span>` : `<span class="pill grey">${esc(t("prod.unavailable"))}</span>`}</td>
      <td data-lbl="">${moveBtns}</td></tr>`;
    }).join("");
    return `<h3 style="margin:14px 0 6px">${esc(sec.name)}</h3>${tableOrEmpty(`<th>${esc(t("prod.f.photo"))}</th><th>${esc(t("prod.th.product"))}</th><th>${esc(t("prod.th.price"))}</th><th>${esc(t("ov.th.status"))}</th><th></th>`, rows)}`;
  }).join("");
  const bodyHtml = sectionHtml || tableOrEmpty(`<th>${esc(t("prod.f.photo"))}</th><th>${esc(t("prod.th.product"))}</th><th>${esc(t("prod.th.price"))}</th><th>${esc(t("ov.th.status"))}</th><th></th>`, "");
  v.innerHTML = head(t("v.products.t"), t("v.products.s"))
    + `<div class="card prod-list">${bodyHtml}
      ${canEdit ? `<div style="margin-top:14px"><button class="btn sm" id="addProd">${esc(t("prod.add"))}</button></div><div id="prodForm"></div>` : ""}<div class="err-text" id="prodErr"></div></div>`;
  // Per-dish photo change (same gold frame, same upload).
  v.querySelectorAll("[data-prod-photo]").forEach(input => {
    const id = input.dataset.prodPhoto;
    bindUpload("#pf-" + id, "product", false, async url => {
      await api(`/api/admin/products/${id}`, {method: "PUT", body: {image_url: url}});
      showView("products");
    }, "#ps-" + id, "#pt-" + id);
  });
  // Move a dish up/down inside its group (swap positions, then refresh).
  v.querySelectorAll("[data-prod-up],[data-prod-down]").forEach(b => b.addEventListener("click", async () => {
    const id = Number(b.dataset.prodUp || b.dataset.prodDown);
    const dir = b.dataset.prodUp ? -1 : 1;
    const me = products.find(p => p.id === id);
    if (!me) return;
    const groupItems = products.filter(p => (p.group_name || "Food") === (me.group_name || "Food"))
      .sort((a, b2) => (a.sort_order - b2.sort_order) || (a.id - b2.id));
    const idx = groupItems.findIndex(p => p.id === id);
    const other = groupItems[idx + dir];
    if (!other) return;
    try {
      await api(`/api/admin/products/${other.id}`, {method: "PUT", body: {sort_order: me.sort_order}});
      await api(`/api/admin/products/${id}`, {method: "PUT", body: {sort_order: other.sort_order}});
      showView("products");
    } catch (e) { showErr($("#prodErr"), e); }
  }));
  const addBtn = $("#addProd");
  if (addBtn) addBtn.addEventListener("click", async () => {
    const shops = await api("/api/admin/shops?limit=100").catch(() => ({shops: []}));
    // Group suggestions: the groups already in use (so the owner
    // reuses a group instead of mistyping a new one).
    const groupOptions = [...new Set(["Food", ...products.map(p => p.group_name || "Food")])]
      .map(g => `<option value="${esc(g)}">`).join("");
    $("#prodForm").innerHTML = `<div class="form-grid" style="margin-top:12px">
      <div><label class="flabel">${esc(t("app.th.shop"))}</label><select id="pfShop">${(shops.shops || []).map(s => `<option value="${s.id}">${esc(s.name)}</option>`).join("")}</select></div>
      <div><label class="flabel">${esc(t("prod.f.name"))}</label><input id="pfName"></div>
      <div><label class="flabel">${esc(t("prod.th.price"))}</label><input id="pfPrice" type="number" min="0" step="0.01"></div>
      <div><label class="flabel">${esc(t("prod.f.currency"))}</label><select id="pfCur"><option value="THB">${esc(t("prod.cur.thb"))}</option><option value="MMK">${esc(t("prod.cur.mmk"))}</option></select></div>
      <div><label class="flabel">${esc(t("prod.f.group"))}</label><input id="pfGroup" list="pfGroupList" placeholder="${esc(t("prod.ph.group"))}"><datalist id="pfGroupList">${groupOptions}</datalist></div>
      <div><label class="flabel">${esc(t("prod.f.desc"))}</label><input id="pfDesc"></div>
      <div class="full"><label class="flabel">${esc(t("prod.f.photo"))} ${esc(t("app.optional"))}</label><input id="pfPhoto" type="hidden"><div class="up-row"><input id="pfPhotoFile" type="file" accept="image/*"></div><div class="muted small">${esc(t("sh.up.hint"))}</div><div class="thumb thumb-single" id="pfPhotoThumb"></div><div class="up-status" id="pfPhotoStatus"></div></div>
      <div class="full"><button class="btn sm" id="pfSave">${esc(t("common.save"))}</button></div></div>`;
    bindUpload("#pfPhotoFile", "product", false, url => {
      $("#pfPhoto").value = url;
      const th = $("#pfPhotoThumb");
      if (th) th.innerHTML = mediaThumb(url, false, false);
    }, "#pfPhotoStatus", "#pfPhotoThumb");
    $("#pfSave").addEventListener("click", async () => {
      try {
        await api("/api/admin/products", {method: "POST", body: {shop_id: Number($("#pfShop").value), name: $("#pfName").value.trim(), price: Number($("#pfPrice").value), currency: $("#pfCur").value, description: $("#pfDesc").value.trim(), group_name: $("#pfGroup").value.trim() || "Food", image_url: $("#pfPhoto").value.trim() || null}});
        showView("products");
      } catch (e) { showErr($("#prodErr"), e); }
    });
  });
}

  {id:"breakfast", name:"မနက်စာ"}, {id:"lunch", name:"နေ့လည်စာ"}, {id:"dinner", name:"ညစာ"},
  {id:"fast", name:"အမြန်စား"}, {id:"drinks", name:"အချိုရည်"},
  {id:"snacks", name:"အဆာပြေ"}, {id:"rice", name:"ထမင်း"}, {id:"noodles", name:"ခေါက်ဆွဲ"}, {id:"bbq", name:"အကင်"}
];
const HOME_DISH_GLYPHS = [
  {id:"", name:"—"}, {id:"noodle", name:"ခေါက်ဆွဲ"}, {id:"salad", name:"သုပ်"}, {id:"soup", name:"ဟင်းရည်"},
  {id:"grill", name:"အကင်"}, {id:"fried", name:"ကြော်"}, {id:"pizza", name:"ပီဇာ"}, {id:"burger", name:"ဘာဂါ"},
  {id:"sushi", name:"ဆူရှီ"}, {id:"hotpot", name:"ဟော့ပေါ့"}, {id:"seafood", name:"ပင်လယ်စာ"},
  {id:"dumpling", name:"ဖက်ထုပ်"}, {id:"bao", name:"ပေါက်စီ"}, {id:"boba", name:"ဘူဘယ် တီး"},
  {id:"coffee", name:"ကော်ဖီ"}, {id:"juice", name:"ဖျော်ရည်"}, {id:"cake", name:"ကိတ်မုန့်"}, {id:"icecream", name:"ရေခဲမုန့်"}
];
function homeDishCatName(id) { const c = HOME_DISH_CATS.find(x => x.id === id); return c ? c.name : id; }
function homeDishCur(p) { return p.currency === "MMK" ? "Ks" : "฿"; }
async function viewHomeDishes(v) {
  const d = await api("/api/admin/home-dishes");
  const canEdit = ME.role === "owner";
  const dishes = d.dishes || [];
  const rows = dishes.map((p, i) => {
    const photo = p.image_url
      ? `<div class="frame-gold prod-frame"><img src="${esc(p.image_url)}" alt=""></div>`
      : `<div class="frame-gold prod-frame"></div>`;
    const moveBtns = canEdit
      ? `<button class="btn sm" data-hd-up="${p.id}" ${i === 0 ? "disabled" : ""} aria-label="up">↑</button> <button class="btn sm" data-hd-down="${p.id}" ${i === dishes.length - 1 ? "disabled" : ""} aria-label="down">↓</button>`
      : "";
    const avail = p.is_available
      ? `<button class="pill green" data-hd-toggle="${p.id}" type="button">${esc(t("hd.available"))}</button>`
      : `<button class="pill grey" data-hd-toggle="${p.id}" type="button">${esc(t("hd.unavailable"))}</button>`;
    return `<tr><td data-lbl=""><div id="ht-${p.id}">${photo}</div>${canEdit ? `<div class="up-row"><input id="hf-${p.id}" type="file" accept="image/*" data-hd-photo="${p.id}"></div><div class="up-status" id="hs-${p.id}"></div>` : ""}</td>
      <td data-lbl="${esc(t("hd.th.dish"))}"><b>${esc(p.name)}</b><br><span class="muted small">${esc(p.description || "")}</span><br><span class="muted small">${esc(homeDishCatName(p.category))}</span></td>
      <td data-lbl="${esc(t("hd.th.price"))}">${p.price != null ? homeDishCur(p) + fmtNum(p.price) : "—"}</td>
      <td data-lbl="${esc(t("ov.th.status"))}">${avail}</td>
      <td data-lbl="">${moveBtns}${canEdit ? ` <button class="btn danger sm" data-hd-delete="${p.id}">${esc(t("hd.delete"))}</button>` : ""}</td></tr>`;
  }).join("");
  const listHtml = rows
    ? tableOrEmpty(`<th>${esc(t("hd.f.photo"))}</th><th>${esc(t("hd.th.dish"))}</th><th>${esc(t("hd.th.price"))}</th><th>${esc(t("ov.th.status"))}</th><th></th>`, rows)
    : `<div class="empty">${esc(t("hd.empty"))}</div>`;
  v.innerHTML = head(t("v.homeDishes.t"), t("v.homeDishes.s"))
    + `<div class="card prod-list">${listHtml}
      ${canEdit ? `<div style="margin-top:14px"><button class="btn sm" id="addHomeDish">${esc(t("hd.add"))}</button></div><div id="homeDishForm"></div>` : ""}<div class="err-text" id="homeDishErr"></div></div>`;
  // Per-dish photo change (same gold frame, same upload).
  v.querySelectorAll("[data-hd-photo]").forEach(input => {
    const id = input.dataset.hdPhoto;
    bindUpload("#hf-" + id, "product", false, async url => {
      await api(`/api/admin/home-dishes/${id}`, {method: "PUT", body: {image_url: url}});
      showView("homeDishes");
    }, "#hs-" + id, "#ht-" + id);
  });
  // Availability toggle.
  v.querySelectorAll("[data-hd-toggle]").forEach(b => b.addEventListener("click", async () => {
    const id = Number(b.dataset.hdToggle);
    const cur = dishes.find(x => x.id === id);
    try {
      await api(`/api/admin/home-dishes/${id}`, {method: "PUT", body: {is_available: !cur.is_available}});
      showView("homeDishes");
    } catch (e) { showErr($("#homeDishErr"), e); }
  }));
  // Move up / down (swap positions, then refresh).
  async function move(id, dir) {
    const i = dishes.findIndex(x => x.id === id);
    const j = i + dir;
    if (i < 0 || j < 0 || j >= dishes.length) return;
    try {
      await api(`/api/admin/home-dishes/${dishes[j].id}`, {method: "PUT", body: {sort_order: dishes[i].sort_order}});
      await api(`/api/admin/home-dishes/${id}`, {method: "PUT", body: {sort_order: dishes[j].sort_order}});
      showView("homeDishes");
    } catch (e) { showErr($("#homeDishErr"), e); }
  }
  v.querySelectorAll("[data-hd-up]").forEach(b => b.addEventListener("click", () => move(Number(b.dataset.hdUp), -1)));
  v.querySelectorAll("[data-hd-down]").forEach(b => b.addEventListener("click", () => move(Number(b.dataset.hdDown), 1)));
  // Delete.
  v.querySelectorAll("[data-hd-delete]").forEach(b => b.addEventListener("click", async () => {
    if (!confirm(t("hd.confirmDelete"))) return;
    try {
      await api(`/api/admin/home-dishes/${b.dataset.hdDelete}`, {method: "DELETE"});
      showView("homeDishes");
    } catch (e) { showErr($("#homeDishErr"), e); }
  }));
  // Add form.
  const addBtn = $("#addHomeDish");
  if (addBtn) addBtn.addEventListener("click", async () => {
    $("#homeDishForm").innerHTML = `<div class="form-grid" style="margin-top:12px">
      <div><label class="flabel">${esc(t("hd.f.name"))}</label><input id="hfName"></div>
      <div><label class="flabel">${esc(t("hd.th.price"))} (${esc(t("app.optional"))})</label><input id="hfPrice" type="number" min="0" step="0.01"></div>
      <div><label class="flabel">${esc(t("hd.f.currency"))}</label><select id="hfCur"><option value="THB">${esc(t("prod.cur.thb"))}</option><option value="MMK">${esc(t("prod.cur.mmk"))}</option></select></div>
      <div><label class="flabel">${esc(t("hd.f.category"))}</label><select id="hfCat">${HOME_DISH_CATS.map(c => `<option value="${c.id}">${esc(c.name)}</option>`).join("")}</select></div>
      <div><label class="flabel">${esc(t("hd.f.glyph"))} (${esc(t("app.optional"))})</label><select id="hfGlyph">${HOME_DISH_GLYPHS.map(g => `<option value="${g.id}">${esc(g.name)}</option>`).join("")}</select></div>
      <div><label class="flabel">${esc(t("hd.f.unit"))}</label><input id="hfUnit" value="၁ ပွဲ"></div>
      <div><label class="flabel">${esc(t("hd.f.desc"))} (${esc(t("app.optional"))})</label><input id="hfDesc"></div>
      <div class="full"><label class="flabel">${esc(t("hd.f.photo"))} ${esc(t("app.optional"))}</label><input id="hfPhoto" type="hidden"><div class="up-row"><input id="hfPhotoFile" type="file" accept="image/*"></div><div class="muted small">${esc(t("sh.up.hint"))}</div><div class="thumb thumb-single" id="hfPhotoThumb"></div><div class="up-status" id="hfPhotoStatus"></div></div>
      <div class="full"><button class="btn sm" id="hfSave">${esc(t("common.save"))}</button></div></div>`;
    bindUpload("#hfPhotoFile", "product", false, url => {
      $("#hfPhoto").value = url;
      const th = $("#hfPhotoThumb");
      if (th) th.innerHTML = mediaThumb(url, false, false);
    }, "#hfPhotoStatus", "#hfPhotoThumb");
    $("#hfSave").addEventListener("click", async () => {
      try {
        const priceRaw = $("#hfPrice").value.trim();
        await api("/api/admin/home-dishes", {method: "POST", body: {
          name: $("#hfName").value.trim(),
          price: priceRaw === "" ? null : Number(priceRaw),
          currency: $("#hfCur").value,
          category: $("#hfCat").value,
          glyph: $("#hfGlyph").value || "bowl",
          unit: $("#hfUnit").value.trim(),
          description: $("#hfDesc").value.trim(),
          image_url: $("#hfPhoto").value || null}});
        showView("homeDishes");
      } catch (e) { showErr($("#homeDishErr"), e); }
    });
  });
}

/* ---------- Finance / Payments (ELEMENTS gradient KPIs + payments donut) ---------- */
async function viewFinance(v) {
  const s = await api("/api/admin/dashboard/summary");
  const fin = s.finance || {income_today: 0, income_month: 0, expense_today: 0, expense_month: 0, net_today: 0, net_month: 0, currency: "THB"};
  const cur = fin.currency;
  const led = await api("/api/admin/ledger?limit=100").catch(() => ({entries: []}));
  const entries = led.entries || led.ledger || [];
  const byMethod = {};
  entries.forEach(e => { const m = e.payment_method || "—"; byMethod[m] = (byMethod[m] || 0) + Math.abs(Number(e.amount || 0)); });
  const methodTotal = Object.values(byMethod).reduce((a, b) => a + b, 0);
  const methodColors = {"Cash": "#0EA5E9", "Card": "#F59E0B", "Online": "#7C3AED", "KBZPay": "#16A34A", "Wave": "#EC4899", "—": "#94A3B8"};
  const methodParts = Object.entries(byMethod).map(([m, tot]) => ({label: m, value: Math.round(tot), color: methodColors[m] || "#64748B"}));
  const rows = entries.map(e => `<tr><td><span class="muted small">${fmtDate(e.created_at)}</span></td><td>${esc(e.entry_type || "")}<br><span class="muted small">${esc(e.note || "")}</span></td>
    <td>${e.direction === "in" ? `<span class="pill green">${esc(t("fin.in"))}</span>` : `<span class="pill amber">${esc(t("fin.out"))}</span>`}</td>
    <td>${fmtMoney(e.amount, e.currency || cur)}</td><td>${esc(e.payment_method || "—")}</td><td>${statusPill(e.status)}</td></tr>`).join("");
  v.innerHTML = head(t("v.finance.t"), t("v.finance.s"))
    + `<div class="notice amber">${esc(t("fin.d3"))}</div>`
    + `<div class="grid kpis">
      <div class="kpi grad g1"><div class="lbl">${esc(t("ov.kpi.incomeToday"))}</div><div class="val">${fmtMoney(fin.income_today, cur)}</div><div class="trend">${esc(t("ov.kpi.incomeMonth").replace("{v}", fmtMoney(fin.income_month, cur)))}</div></div>
      <div class="kpi grad g2"><div class="lbl">${esc(t("fin.expenseToday"))}</div><div class="val">${fmtMoney(fin.expense_today, cur)}</div><div class="trend">${esc(t("ov.kpi.incomeMonth").replace("{v}", fmtMoney(fin.expense_month, cur)))}</div></div>
      <div class="kpi grad g3"><div class="lbl">${esc(t("fin.netToday"))}</div><div class="val">${fmtMoney(fin.net_today, cur)}</div><div class="trend">${esc(t("ov.kpi.incomeMonth").replace("{v}", fmtMoney(fin.net_month, cur)))}</div></div>
      <div class="kpi grad g4"><div class="lbl">${esc(t("fin.ordersTotal"))}</div><div class="val">${fmtNum(s.orders.total)}</div><div class="trend">${esc(t("fin.todayN").replace("{n}", fmtNum(s.orders.today)))}</div></div>
      <div class="kpi grad g5"><div class="lbl">${esc(t("ov.kpi.shops"))}</div><div class="val">${fmtNum(s.shops.total)}</div><div class="trend">${esc(t("fin.shopsApproved").replace("{n}", fmtNum(s.shops.active)))}</div></div>
    </div>`
    + `<div class="grid cards2" style="margin-top:14px">
      <div class="card"><h2>${esc(t("fin.payT"))}</h2>${donut(methodParts, methodTotal, methodTotal ? fmtMoney(methodTotal, cur) : "0", t("fin.fromListed"))}<div class="muted small">${esc(t("fin.donutNote"))}</div></div>
      <div class="card"><h2>${esc(t("fin.addT"))}</h2>
        <div class="form-grid"><div><label class="flabel">${esc(t("sh.f.type"))}</label><select id="lgType"><option value="order_charge">order_charge</option><option value="delivery_fee">delivery_fee</option><option value="refund">refund</option><option value="merchant_settlement">merchant_settlement</option><option value="adjustment">adjustment</option><option value="reversal">reversal</option></select></div>
        <div><label class="flabel">${esc(t("fin.f.amount"))}</label><input id="lgAmt" type="number" min="0" step="0.01"></div>
        <div><label class="flabel">${esc(t("fin.in"))} / ${esc(t("fin.out"))}</label><select id="lgDir"><option value="in">${esc(t("fin.in"))} (in)</option><option value="out">${esc(t("fin.out"))} (out)</option></select></div>
        <div><label class="flabel">${esc(t("prod.f.currency"))}</label><select id="lgCur"><option value="THB">${esc(t("fin.curThb"))}</option><option value="MMK">${esc(t("fin.curMmk"))}</option></select></div>
        <div><label class="flabel">${esc(t("fin.f.method"))}</label><input id="lgMethod" placeholder="Cash / KBZPay / Wave"></div>
        <div><label class="flabel">${esc(t("fin.f.shop"))}</label><input id="lgShop" type="number" min="1"></div>
        <div class="full"><label class="flabel">${esc(t("fin.f.note"))}</label><input id="lgNote"></div>
        <div class="full"><button class="btn sm" id="lgSave">${esc(t("fin.save"))}</button> <span class="muted small">${esc(t("fin.appendNote"))}</span></div></div>
        <div class="err-text" id="lgErr"></div><div class="ok-text" id="lgOk"></div></div>
    </div>`
    + `<div class="card" style="margin-top:14px"><h2>${esc(t("fin.ledgerT"))}</h2>${tableOrEmpty(`<th>${esc(t("dl.th.date"))}</th><th>${esc(t("fin.th.typeNote"))}</th><th>${esc(t("fin.th.direction"))}</th><th>${esc(t("fin.f.amount"))}</th><th>${esc(t("fin.th.method"))}</th><th>${esc(t("ov.th.status"))}</th>`, rows)}</div>`;

    const shop = $("#lgShop").value.trim();

    try { await api("/api/admin/ledger", {method: "POST", body}); $("#lgOk").textContent = t("common.saved"); showView("finance"); }
    catch (e) { showErr($("#lgErr"), e); }
  });
}

  });

    const f = e.target.files && e.target.files[0];
    if (!f) return;
    const KNOWN = ["global_hours", "delivery", "banners", "registration_form", "hero_image", "promo_slots", "featured_shop_ids", "contact"];
    try {
      const obj = JSON.parse(await f.text());
      if (!obj || typeof obj !== "object" || Array.isArray(obj)) throw new Error(t("set.backup.errJson"));
      const bad = Object.keys(obj).filter(k => KNOWN.indexOf(k) === -1);
      if (bad.length) throw new Error(t("set.backup.errKey").replace("{n}", bad.join(", ")));
      const results = [];
      for (const k of Object.keys(obj)) {
        try {
          const body = {}; body[k] = obj[k];
          await api("/api/admin/settings", {method: "PUT", body});
          results.push(k + ": OK");
        } catch (err) {
          results.push(k + ": FAIL — " + (err.message || err));
        }
      }
      BK_RESULTS = `<ul class="checklist">${results.map(r => `<li>${esc(r)}</li>`).join("")}</ul>`;
      showView("settings");
    } catch (err) { showErr($("#bkErr"), err); }
  });
  if (BK_RESULTS) { const br = $("#bkResults"); if (br) br.innerHTML = BK_RESULTS; BK_RESULTS = null; }
}

    const d = await api("/api/admin/login", {method: "POST", body: {username: $("#username").value.trim(), password: $("#password").value}});
    TOKEN = d.token || d.session_token;
    if (!TOKEN) throw new Error(t("login.errToken"));
    lsSet(DASH_TOKEN_KEY, TOKEN);
    ME = await api("/api/admin/me");
    try { const h = await api("/health"); $("#apiState").textContent = t("top.apiOk"); } catch (err) { $("#apiState").textContent = t("top.apiFail"); }
    $("#loginWrap").classList.add("hidden"); $("#app").classList.remove("hidden");
    startRefreshTimer();
    showView(ME.role === "merchant" ? "moverview" : "overview");
  } catch (err) {
    $("#loginErr").textContent = err.status === 401 ? t("login.err401") : t("common.err") + " — " + (err.message || err);
  } finally { btn.disabled = false; }
});

/* ---------- restore saved login (Min 2026-11-18) ---------- */
/* If a token was saved on this device, try it: a valid session skips
   the login screen after a refresh; an expired/revoked token (the
   server session lasts 12h) falls back to the login screen. */
(async function restoreSavedLogin() {
  const saved = lsGet(DASH_TOKEN_KEY, null);
  if (!saved) return;
  TOKEN = saved;
  try {
    ME = await api("/api/admin/me");
    try { const h = await api("/health"); $("#apiState").textContent = t("top.apiOk"); } catch (err) { $("#apiState").textContent = t("top.apiFail"); }
    $("#loginWrap").classList.add("hidden"); $("#app").classList.remove("hidden");
    startRefreshTimer();
    showView(ME.role === "merchant" ? "moverview" : "overview");
  } catch (err) {
    TOKEN = null; ME = null;
    lsDel(DASH_TOKEN_KEY);
  }
})();
</script>
