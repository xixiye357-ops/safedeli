<!DOCTYPE html>
<html lang="my">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Safe Deli Tachileik Service</title>
<style>
:root{
  --purple:#5422c8; --violet:#7C3AED; --violet-dark:#3B1A7A; --pink:#EC4899;
  --gold:#D4AF37; --bg:#F4F2FB; --card:#fff; --ink:#1E1B2E; --muted:#6B6580;
  --line:#E7E2F5; --green:#16A34A; --green-bg:#DCFCE7; --amber:#D97706; --amber-bg:#FEF3C7;
  --red:#DC2626; --red-bg:#FEE2E2; --blue:#2563EB; --blue-bg:#DBEAFE;
}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans Myanmar",sans-serif;background:var(--bg);color:var(--ink);font-size:15px}
a{color:var(--purple)}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:15px;padding:9px 10px;border:1px solid var(--line);border-radius:9px;background:#fff;width:100%}
input[type="checkbox"]{width:auto}
input:focus,select:focus,textarea:focus{outline:2px solid var(--violet);outline-offset:0;border-color:var(--violet)}
h1{font-size:22px;margin:0 0 4px} h2{font-size:17px;margin:0 0 10px} h3{font-size:15px;margin:0 0 8px}
.muted{color:var(--muted);font-size:13px} .small{font-size:12.5px}
.hidden{display:none!important}
/* ---------- login ---------- */
#loginWrap{min-height:100vh;display:flex;align-items:center;justify-content:center;gap:56px;flex-wrap:wrap;padding:36px 22px;position:relative;overflow:hidden;isolation:isolate;background:radial-gradient(720px 380px at 50% 108%,rgba(236,72,153,.38),transparent 65%),radial-gradient(620px 320px at 50% 104%,rgba(245,197,66,.30),transparent 60%),radial-gradient(900px 520px at 88% -10%,rgba(124,58,237,.45),transparent 60%),linear-gradient(160deg,#1E0B45 0%,#3B1A7A 45%,#5422c8 75%,#6D28D9 100%)}
#loginWrap::before{content:"";position:absolute;z-index:0;top:-46px;right:-130px;width:520px;height:130px;transform:rotate(-16deg);border-radius:50%;background:linear-gradient(90deg,transparent,#F5C542 28%,#FFE97A 50%,#D4AF37 72%,transparent);opacity:.85;filter:blur(1px)}
#loginWrap::after{content:"";position:absolute;z-index:0;bottom:-58px;left:-150px;width:620px;height:150px;transform:rotate(-14deg);border-radius:50%;background:linear-gradient(90deg,transparent,#D4AF37 30%,#FFE97A 52%,#B8860B 74%,transparent);opacity:.7;filter:blur(1px)}
.login-hero{position:relative;z-index:1;text-align:center;max-width:460px}
.login-hero img.logo{width:128px;height:128px;object-fit:cover;border:3px solid #F5C542;border-radius:28px;box-shadow:0 10px 30px rgba(0,0,0,.4),0 0 24px rgba(245,197,66,.35);background:#2A1650}
.login-hero .wordmark{margin:16px 0 6px;font-size:clamp(56px,8vw,84px);line-height:1.02;font-weight:800;font-style:italic;letter-spacing:-1px;color:#fff;text-shadow:0 4px 24px rgba(0,0,0,.35)}
.login-hero .wordmark .wm-deli{background:linear-gradient(180deg,#FFF3B0,#F5C542 55%,#D4AF37);background-size:100% 200%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:login-shimmer 6s ease-in-out infinite}
.login-hero .hero-tag{color:rgba(255,255,255,.88);font-size:16px;letter-spacing:.4px}
.login-hero .hero-swoosh{width:150px;height:6px;margin:12px auto 0;border-radius:3px;background:linear-gradient(90deg,transparent,#F5C542,#FFE97A,transparent);animation:login-shimmer 6s ease-in-out infinite}
.login-card{position:relative;z-index:1;background:linear-gradient(165deg,rgba(255,255,255,.15),rgba(255,255,255,.06) 55%,rgba(255,255,255,.10));-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.28);border-radius:24px;padding:30px 28px;width:100%;max-width:420px;box-shadow:0 24px 60px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.25);text-align:center;color:#fff}
.login-card::before{content:"";position:absolute;top:-1px;left:10%;right:10%;height:2px;border-radius:2px;background:linear-gradient(90deg,transparent,#FFE97A,#F5C542,transparent);filter:drop-shadow(0 0 8px rgba(245,197,66,.9));animation:login-glow 5s ease-in-out infinite}
.login-card .login-title{font-size:23px;font-weight:700;line-height:1.3}
.login-card .login-lang{text-align:right;margin:0 0 6px}
#loginWrap select{background:rgba(20,8,40,.45);color:#fff;border:1px solid rgba(255,255,255,.32);border-radius:9px;padding:8px 10px;width:auto}
#loginWrap select option{color:#1E1B2E}
.login-card form{text-align:left;margin-top:16px}
#loginWrap .login-card label{display:block;font-size:13px;color:rgba(255,255,255,.78);margin:12px 0 5px}
#loginWrap .login-card input{background:rgba(20,8,40,.45);color:#fff;border:1px solid rgba(255,255,255,.32);border-radius:11px}
#loginWrap .login-card input::placeholder{color:rgba(255,255,255,.55)}
#loginWrap .login-card input:focus{outline:2px solid #F5C542;outline-offset:0;border-color:#F5C542}
.login-card .err{color:#FCA5A5;font-size:13px;margin-top:10px;min-height:18px}
.login-card .muted{color:rgba(255,255,255,.72)}
.pw-wrap{position:relative}
.pw-wrap input{padding-right:44px}
.pw-eye{position:absolute;right:6px;top:50%;transform:translateY(-50%);border:0;background:transparent;font-size:19px;line-height:1;cursor:pointer;padding:6px;color:rgba(255,255,255,.82);width:auto}
.pw-eye:focus{outline:2px solid #F5C542;border-radius:6px}
#loginWrap .login-card .btn{background:linear-gradient(135deg,#7C3AED,#5422c8 60%,#6D28D9);border:1px solid rgba(255,255,255,.22);border-radius:12px;padding:12px 16px;box-shadow:0 10px 24px rgba(59,26,122,.55),inset 0 1px 0 rgba(255,255,255,.25)}
#loginWrap .login-card .btn:hover{background:linear-gradient(135deg,#8B5CF6,#5B2BD6 60%,#7C3AED)}
#loginWrap .login-card .btn:disabled{opacity:.55}
@keyframes login-shimmer{0%,100%{background-position:50% 0}50%{background-position:50% 100%}}
@keyframes login-glow{0%,100%{opacity:.65}50%{opacity:1}}
@media (prefers-reduced-motion:reduce){.login-hero .wordmark .wm-deli,.login-hero .hero-swoosh,.login-card::before{animation:none}}
@media (max-width:760px){#loginWrap{gap:26px;padding:30px 16px}#loginWrap::before{width:340px;height:90px;top:-30px;right:-90px}#loginWrap::after{width:400px;height:100px;bottom:-40px;left:-110px}.login-hero img.logo{width:104px;height:104px}.login-card{padding:26px 20px}}
/* ---------- shop form: AM/PM time picker (no typing) ---------- */
.time-picker{display:flex;gap:6px}
.time-picker select{flex:1;min-width:0;padding:9px 4px;text-align:center}
/* ---------- shop form: media frames (2026-11-13, Min: use the CURRENT
   frames — they are beautiful, do not build different/new ones).
   This is the app's gold photo frame, copied verbatim (v15 frames +
   v19 ring fix): a 3px dark-bronze ring that is always there, plus a
   bright gold arc that travels around it (4s). The uploaded picture
   sits inside it, so the preview looks exactly like the app's
   shop-photo and Menu dish cards. ---------- */
.frame-gold{position:relative; overflow:hidden; padding:3px; background:linear-gradient(135deg,#8A6508,#6B4E00); box-shadow:0 0 10px rgba(245,197,24,.45)}
.frame-gold::before{content:""; position:absolute; inset:-50%; animation:frame-spin 4s linear infinite; pointer-events:none; background:conic-gradient(from 0deg, transparent 0deg, transparent 240deg, #F5C518 270deg, #FFE97A 300deg, #FFFFFF 325deg, #FFF3B0 345deg, #F5C518 360deg)}
@keyframes frame-spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){.frame-gold::before{animation:none}}
.frame-gold img,.frame-gold video{position:relative; z-index:1; width:100%; height:100%; object-fit:cover; display:block}
.frame-gold video{background:#000}
/* Preview sizes: one big frame for a single photo/video/menu (full
   width on a phone, 16:9), two-per-row frames for photo lists. */
.thumb-single .frame-gold{width:100%; max-width:340px; aspect-ratio:16/9; border-radius:12px; margin-top:8px}
.thumb-single .frame-gold img,.thumb-single .frame-gold video{border-radius:9px}
.thumb-grid{display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:8px}
.thumb-grid .frame-gold{aspect-ratio:4/3; border-radius:10px}
.thumb-grid .frame-gold img,.thumb-grid .frame-gold video{border-radius:8px}
.thumb:empty{display:none}
/* Gold NEW badge on the menu frame (Min 2026-11-13: NEW in real gold
   #A67C00, at the corner of the picture — never green). */
.new-badge{position:absolute; top:6px; right:6px; z-index:2; background:#A67C00; color:#fff; font-size:11px; font-weight:800; padding:3px 8px; border-radius:999px; box-shadow:0 1px 4px rgba(0,0,0,.25)}
.up-row{margin-top:6px}
.up-row input[type=file]{width:100%}
.up-status{font-size:13px;color:var(--muted);margin-top:4px;min-height:16px}
/* Dish photo frame in the Products list (same gold frame, smaller). */
.prod-frame{width:120px; height:90px; border-radius:10px; flex:none}
.prod-frame img{border-radius:8px}
.form-sec{grid-column:1/-1;font-weight:700;margin-top:8px}
.form-sec .muted{font-weight:400}
.btn{display:inline-block;border:0;border-radius:10px;padding:10px 16px;font-size:15px;font-weight:600;background:var(--purple);color:#fff}
.btn:hover{background:#4520a8} .btn:disabled{opacity:.55;cursor:default}
.btn.ghost{background:#fff;color:var(--purple);border:1px solid var(--purple)}
.btn.danger{background:var(--red)} .btn.green{background:var(--green)} .btn.sm{padding:6px 10px;font-size:13px;border-radius:8px}
.btn.block{width:100%}
/* ---------- app shell ---------- */
#app{display:flex;min-height:100vh}
aside.sidebar{width:248px;flex:0 0 248px;background:linear-gradient(180deg,#2E1065,#5422c8 70%,#6D28D9);color:#fff;display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
.brand{display:flex;align-items:center;gap:10px;padding:16px 16px 12px}
#sideBack{position:fixed;inset:0;background:rgba(20,8,40,.45);z-index:40}
#sideClose{display:none}
.brand img{width:46px;height:46px;border-radius:50%;object-fit:cover;border:2px solid rgba(255,255,255,.5);background:#fff}
.brand .name{font-size:18px;font-weight:800;line-height:1.1}
.brand .sub{font-size:11.5px;opacity:.85}
nav.menu{flex:1;overflow-y:auto;padding:6px 10px 16px}
nav.menu button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:transparent;border:0;color:#EDE9FE;padding:10px 12px;border-radius:10px;font-size:14.5px;margin-bottom:2px}
nav.menu button:hover{background:rgba(255,255,255,.12)}
nav.menu button.active{background:#fff;color:var(--violet-dark);font-weight:700}
nav.menu button .ic{font-size:17px;flex:0 0 22px;text-align:center;line-height:1}
nav.menu button .badge{margin-left:auto;background:var(--pink);color:#fff;border-radius:20px;padding:1px 8px;font-size:12px;font-weight:700}
nav.menu .sect{font-size:11px;letter-spacing:.08em;text-transform:uppercase;opacity:.65;padding:14px 12px 5px}
.side-foot{padding:12px 16px;border-top:1px solid rgba(255,255,255,.2);font-size:12.5px;opacity:.9}
main.main{flex:1;min-width:0;display:flex;flex-direction:column}
header.topbar{background:#fff;border-bottom:1px solid var(--line);padding:10px 20px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;position:sticky;top:0;z-index:20}
header.topbar .hamb{display:none;border:1px solid var(--line);background:#fff;border-radius:9px;padding:8px 11px;font-size:16px}
header.topbar input.search{max-width:340px}
.top-right{margin-left:auto;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.role-pill{background:var(--violet);color:#fff;border-radius:20px;padding:5px 12px;font-size:13px;font-weight:700}
#view{padding:20px;max-width:1280px;width:100%;margin:0 auto}
.view-head{display:flex;flex-wrap:wrap;align-items:flex-end;gap:10px;margin-bottom:16px}
.view-head .spacer{flex:1}
/* ---------- cards / KPI ---------- */
.grid{display:grid;gap:14px}
.kpis{grid-template-columns:repeat(5,1fr)}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}
.kpi .lbl{font-size:13px;color:var(--muted)}
.kpi .val{font-size:26px;font-weight:800;margin:4px 0 2px}
.kpi .trend{font-size:12.5px;color:var(--green);font-weight:600}
.kpi.grad{color:#fff;border:0}
.kpi.grad .lbl,.kpi.grad .trend{color:rgba(255,255,255,.85)}
.g1{background:linear-gradient(135deg,#4F46E5,#7C3AED)} .g2{background:linear-gradient(135deg,#0EA5E9,#6366F1)}
.g3{background:linear-gradient(135deg,#F59E0B,#EC4899)} .g4{background:linear-gradient(135deg,#7C3AED,#DB2777)}
.g5{background:linear-gradient(135deg,#059669,#0EA5E9)}
.cards2{grid-template-columns:2fr 1fr} .cards3{grid-template-columns:1fr 1fr 1fr} .cards32{grid-template-columns:3fr 2fr}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}
.card h2{display:flex;align-items:center;gap:8px}
.card h2 .more{margin-left:auto;font-size:13px;font-weight:600}
/* ---------- tables ---------- */
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;color:var(--muted);font-size:12.5px;padding:8px 8px;border-bottom:2px solid var(--line);white-space:nowrap}
td{padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
.tbl-wrap{overflow-x:auto}
/* Burmese confirm modal (v19.56): native confirm() buttons follow the
   browser language (Chinese on Min's phone). This asks in Burmese. */
.cfm-back{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;z-index:9999;padding:16px}
.cfm-box{background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:18px;max-width:420px;width:100%}
.cfm-btns{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}
/* Fee box (v19.56): on phones the fee row stacks vertically with big
   tap targets, and the Orders table scrolls sideways instead of
   squishing its columns. */
.feebox{display:flex;gap:4px;flex-wrap:wrap;align-items:center;margin-top:6px}
.feebox input[data-fee-input]{width:80px}
.feebox input[data-fee-note]{width:120px}
.orders-tbl table{min-width:680px}
@media (max-width:640px){
  .feebox{flex-direction:column;align-items:stretch}
  .feebox input[data-fee-input],.feebox input[data-fee-note]{width:100%}
  .feebox button{width:100%;min-height:44px;font-size:15px}
}
.pill{display:inline-block;border-radius:20px;padding:2px 10px;font-size:12.5px;font-weight:700;white-space:nowrap}
.pill.green{background:var(--green-bg);color:#166534} .pill.amber{background:var(--amber-bg);color:#92400E}
.pill.red{background:var(--red-bg);color:#991B1B} .pill.blue{background:var(--blue-bg);color:#1E40AF}
.pill.grey{background:#F1F5F9;color:#475569} .pill.purple{background:#EDE9FE;color:#5B21B6}
.pill.new{background:#FEF3C7;color:#A67C00;border:1px solid #C9A227} /* NEW is always real gold #A67C00, never green (Min 2026-11-13) */
.pill.test{background:#FEF9C3;color:#854D0E;border:1px dashed #EAB308}
.empty{padding:26px;text-align:center;color:var(--muted)}
/* ---------- chart / donut ---------- */
.bars{display:flex;align-items:flex-end;gap:10px;height:150px;padding:8px 4px 0}
.bar-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end}
.bar{width:100%;max-width:44px;border-radius:6px 6px 0 0;background:linear-gradient(180deg,var(--violet),var(--purple));min-height:3px}
.bar-col .d{font-size:11.5px;color:var(--muted)}
.bar-col .v{font-size:11.5px;font-weight:700}
.donut-wrap{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.donut{width:150px;height:150px;border-radius:50%;flex:0 0 150px;display:flex;align-items:center;justify-content:center;position:relative}
.donut::after{content:"";position:absolute;inset:26px;background:#fff;border-radius:50%}
.donut .center{position:relative;z-index:1;text-align:center}
.donut .center b{font-size:22px;display:block}
.donut .center span{font-size:12px;color:var(--muted)}
.legend{list-style:none;margin:0;padding:0;font-size:13.5px}
.legend li{display:flex;gap:8px;align-items:center;padding:4px 0}
.legend .sw{width:12px;height:12px;border-radius:4px;flex:0 0 12px}
.legend b{margin-left:auto;padding-left:14px}
/* ---------- misc ---------- */
.notice{border-radius:12px;padding:12px 14px;font-size:14px;margin-bottom:14px}
.notice.amber{background:var(--amber-bg);color:#78350F;border:1px solid #FDE68A}
.notice.blue{background:var(--blue-bg);color:#1E3A8A;border:1px solid #BFDBFE}
.notice.green{background:var(--green-bg);color:#14532D;border:1px solid #BBF7D0}
.checklist{list-style:none;margin:0;padding:0}
.checklist li{padding:6px 0;border-bottom:1px dashed var(--line);font-size:14px}
.checklist li:last-child{border-bottom:0}
.checklist .ok{color:var(--green);font-weight:700} .checklist .no{color:var(--red);font-weight:700}
.row-flex{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row-flex>*{flex:1;min-width:160px}
.tabs{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.tabs button{border:1px solid var(--line);background:#fff;border-radius:20px;padding:8px 16px;font-size:14px}
.tabs button.active{background:var(--purple);color:#fff;border-color:var(--purple);font-weight:700}
.kv{display:grid;grid-template-columns:150px 1fr;gap:6px 12px;font-size:14px}
.kv dt{color:var(--muted)} .kv dd{margin:0;overflow-wrap:anywhere;word-break:break-word;min-width:0}
.kv>*{min-width:0} .grid>*{min-width:0}
#langSel,#loginLangSel{width:auto}
/* ---------- dark theme (body.dark) ---------- */
body.dark{--bg:#150A28;--card:#2A1650;--ink:#F3EFFF;--muted:#C4B5FD;--line:#3D2A6B;--green-bg:#14532D;--amber-bg:#451A03;--red-bg:#450A0A;--blue-bg:#172554;--gold:#F5C542;--gold2:#F59E0B}
body.dark input,body.dark select,body.dark textarea{background:#2E2844;color:var(--ink);border-color:var(--line)}
body.dark header.topbar{background:#241F33}
body.dark .tabs button{background:#2E2844;color:var(--ink);border-color:var(--line)}
body.dark .btn.ghost{background:#241F33;color:#D4AF37;border-color:#A67C00}
body.dark aside.sidebar{background:linear-gradient(180deg,#1E0B45,#3B1A7A 70%,#5422c8)}
body.dark .donut::after{background:var(--card)}
body.dark .notice.amber{background:#451A03;color:#FDE68A;border-color:#92400E}
body.dark .notice.blue{background:#172554;color:#BFDBFE;border-color:#1E40AF}
body.dark .notice.green{background:#14532D;color:#BBF7D0;border-color:#166534}
body.dark .login-card{background:linear-gradient(165deg,rgba(255,255,255,.15),rgba(255,255,255,.06) 55%,rgba(255,255,255,.10));color:#fff}
body.dark .login-card label{color:rgba(255,255,255,.78)}
body.dark .pill.green{background:var(--green-bg);color:#BBF7D0}
body.dark .pill.amber{background:var(--amber-bg);color:#FDE68A}
body.dark .pill.red{background:var(--red-bg);color:#FECACA}
body.dark .pill.blue{background:var(--blue-bg);color:#BFDBFE}
body.dark .pill.grey{background:#3A334F;color:#D6D3E0}
body.dark .pill.purple{background:#3B1A7A;color:#DDD6FE}
textarea{resize:vertical;min-height:80px}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.form-grid .full{grid-column:1/-1}
.opt-ed{border:1.5px solid var(--line);border-radius:14px;padding:12px;background:var(--bg)}
.opt-ed .flabel{display:block;margin:8px 0 4px}
.opt-row{display:flex;gap:8px;margin:6px 0;align-items:center}
.opt-row .opt-name{flex:1}
.opt-row .opt-price{width:110px}
label.flabel{display:block;font-size:13px;color:var(--muted);margin-bottom:5px}
.err-text{color:var(--red);font-size:13.5px;margin-top:8px;min-height:18px}
.ok-text{color:var(--green);font-size:13.5px;margin-top:8px;min-height:18px}
.pager{display:flex;gap:10px;align-items:center;margin-top:12px;font-size:13.5px}
/* ---------- responsive: preview breakpoints 760 / 980 / 1200 ---------- */
@media (max-width:1200px){ .kpis{grid-template-columns:repeat(3,1fr)} .cards3{grid-template-columns:1fr 1fr} }
@media (max-width:980px){
  .kpis{grid-template-columns:repeat(2,1fr)} .cards2,.cards32,.cards3{grid-template-columns:1fr}
  aside.sidebar{position:fixed;left:0;top:0;bottom:0;z-index:50;transform:translateX(-105%);transition:transform .2s;box-shadow:0 0 40px rgba(0,0,0,.3)}
  aside.sidebar.open{transform:none}
  #sideClose{display:inline-block;margin-left:auto;background:rgba(255,255,255,.14);color:#fff;border:1px solid rgba(255,255,255,.35);border-radius:9px;padding:8px 11px;font-size:16px;line-height:1}
  header.topbar .hamb{display:inline-block}
}
@media (max-width:760px){

<script>
"use strict";
/* Safe Deli Unified Dashboard — single file, no demo data.
   Every number, name and row comes from the API. Empty states are
   shown honestly when the API returns nothing. Login token is saved
   in localStorage on this device (Min asked 2026-11-18). Since v19.66
   the login screen shows on the first open in this browser (manual
   entry, tap Log in to enter); once entered, later opens and
   refreshes re-enter directly to the saved view. Logout clears
   the token and the entered flag. The server session still
   expires 12h after login. */
let TOKEN = null, ME = null, CURRENT_VIEW = null, LAST_TABLE_ROWS = [];
let RESTORE_GEN = 0;
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmtNum = n => (n == null || isNaN(n)) ? "—" : Number(n).toLocaleString("en-US");
const fmtMoney = (n, cur) => {
  if (n == null || isNaN(n)) return "—";
  const v = Number(n).toLocaleString("en-US", {maximumFractionDigits: 2});
  return cur === "MMK" ? v + " Ks" : "฿" + v;
};
const fmtDate = s => {
  if (!s) return "—";
  const d = new Date(s);
  return isNaN(d) ? esc(s) : d.toLocaleString("en-GB", {day:"2-digit", month:"short", hour:"2-digit", minute:"2-digit"});
};
const statusPill = st => {
  const m = {pending:["grey","st.pending"], waiting:["amber","st.waiting"], new:["blue","st.new"], confirmed:["blue","st.confirmed"],
    shop_confirmed:["green","st.shop_confirmed"], shop_rejected:["red","st.shop_rejected"],
    preparing:["amber","st.preparing"], delivering:["blue","st.delivering"], delivered:["green","st.delivered"],
    cancelled:["red","st.cancelled"], failed:["red","st.failed"], completed:["green","st.completed"],
    processing:["amber","st.processing"], shipped:["blue","st.shipped"], active:["green","st.active"],
    approved:["green","st.approved"], suspended:["red","st.suspended"], rejected:["red","st.rejected"],
    verified:["green","st.verified"], assigned:["blue","st.assigned"], accepted:["blue","st.accepted"],
    picked_up:["blue","st.picked_up"], created:["grey","st.created"]};
  const p = m[st] || ["grey", st || "—"];
  return `<span class="pill ${p[0]}">${esc(m[st] ? t(p[1]) : p[1])}</span>`;
};
// 4 workflow stages (2026-11-22, point 6): display labels only — the
// internal order_status values stay unchanged. A fee-accepted order
// still shows 'pending' until the dashboard moves it, so it counts
// as confirmed (same rule as the API stage filter + bot labels).
const stageOf = o => {
  const st = o.order_status || "pending";
  if (st === "cancelled") return "cancelled";
  if (st === "delivered") return "delivered";
  if (st === "delivering") return "delivering";
  if (st === "preparing") return "preparing";
  // Wait (Min 2026-11-24): a held order is waiting, even after the
  // customer accepted the fee — the stage pill must not hide it.
  if (st === "waiting") return "waiting";
  if (st === "confirmed" || o.fee_status === "accepted") return "confirmed";
  if (st === "pending" && o.fee_status === "pending") return "waiting";
  return "new";
};
const stagePill = o => {
  const s = stageOf(o);
  const c = {new: "blue", waiting: "amber", confirmed: "green", preparing: "amber", delivering: "blue", delivered: "green", cancelled: "red"}[s];
  return `<span class="pill ${c}">${esc(t("ord.stage." + s))}</span>`;
};
async function api(path, opts) {
  opts = opts || {};
  const res = await fetch(path, {
    method: opts.method || "GET",
    headers: Object.assign({"Accept": "application/json"},
      opts.body ? {"Content-Type": "application/json"} : {},
      TOKEN ? {"Authorization": "Bearer " + TOKEN} : {}),
    body: opts.body ? JSON.stringify(opts.body) : undefined
  });
  const ct = res.headers.get("content-type") || "";
  const data = ct.includes("application/json") ? await res.json().catch(() => ({})) : {};
  if (!res.ok) {
    const err = new Error((data && data.error) || ("HTTP " + res.status));
    err.status = res.status; throw err;
  }
  return data;
}
async function apiCsv(path, filename) {
  const res = await fetch(path, {headers: TOKEN ? {"Authorization": "Bearer " + TOKEN} : {}});
  if (!res.ok) throw new Error("HTTP " + res.status);
  const blob = await res.blob();
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = filename; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 5000);
}
function donut(parts, total, centerTop, centerSub) {
  // parts: [{label, value, color}] — pure CSS conic-gradient donut.
  if (!total) return `<div class="donut-wrap"><div class="donut" style="background:#EDE9FE"><div class="center"><b>0</b><span>${esc(centerSub || "")}</span></div></div><ul class="legend"><li>${esc(t("common.empty"))}</li></ul></div>`;
  let acc = 0; const stops = parts.map(p => {
    const from = acc / total * 360, to = (acc + p.value) / total * 360; acc += p.value;
    return `${p.color} ${from}deg ${to}deg`;
  }).join(", ");
  const rows = parts.map(p => `<li><span class="sw" style="background:${p.color}"></span>${esc(p.label)}<b>${fmtNum(p.value)} (${Math.round(p.value / total * 100)}%)</b></li>`).join("");
  return `<div class="donut-wrap"><div class="donut" style="background:conic-gradient(${stops})"><div class="center"><b>${esc(centerTop)}</b><span>${esc(centerSub || "")}</span></div></div><ul class="legend">${rows}</ul></div>`;
}
function barchart(chart) {
  if (!chart || !chart.length) return `<div class="empty">${esc(t("common.empty"))}</div>`;
  const max = Math.max.apply(null, chart.map(c => c.income || 0).concat([1]));
  const cols = chart.map(c => {
    const h = Math.max(2, Math.round((c.income || 0) / max * 110));
    const d = (c.date || "").slice(5);
    return `<div class="bar-col" title="${esc(c.date || "")} — ฿${fmtNum(c.income || 0)} • ${esc(t("common.ordersN").replace("{n}", String(c.orders || 0)))}"><div class="v">${fmtNum(c.income || 0)}</div><div class="bar" style="height:${h}px"></div><div class="d">${esc(d)}</div></div>`;
  }).join("");
  return `<div class="bars">${cols}</div>`;
}
function tableOrEmpty(head, rowsHtml) {
  if (!rowsHtml) return `<div class="empty">${esc(t("common.empty"))}</div>`;
  return `<div class="tbl-wrap"><table><thead><tr>${head}</tr></thead><tbody>${rowsHtml}</tbody></table></div>`;
}
function showErr(el, err) { if (el) el.textContent = t("common.err") + " — " + (err.message || err); }

// Burmese confirm modal (v19.56): native confirm() buttons follow the
// browser language (Chinese on Min's phone). askConfirm asks the same
// question in Burmese and resolves true/false.
function askConfirm(msg) {
  return new Promise((res) => {
    const back = document.getElementById("cfmBack");
    const m = document.getElementById("cfmMsg");
    const yes = document.getElementById("cfmYes");
    const no = document.getElementById("cfmNo");
    if (!back || !m || !yes || !no) { res(confirm(msg)); return; }
    m.textContent = msg;
    back.classList.remove("hidden");
    const done = (v) => { back.classList.add("hidden"); yes.onclick = null; no.onclick = null; back.onclick = null; res(v); };
    yes.onclick = () => done(true);
    no.onclick = () => done(false);
    back.onclick = (e) => { if (e.target === back) done(false); };
  });
}

let NAV_BADGES = {};
async function refreshNavBadges() {
  try {
    const s = await api("/api/admin/dashboard/summary");
    const d = await api("/api/admin/home-dishes").catch(() => ({dishes: []}));
    const st = await api("/api/admin/settings").catch(() => ({}));

function navFor(role) { return (role === "merchant" ? MERCHANT_NAV : ADMIN_NAV).filter(n => n.roles.includes(role)); }
function showSwitchToast(msg) {

// Multi-shop switch (v19.82): the selection lives on the session row
// server-side. On success re-fetch /me, re-render the nav + current
// view (fresh per-shop data), reset the order filter, keep date
// ranges. On failure re-fetch /me to revert the select and show a
// transient note. The refresh tick never reverts a switch: a focused
// SELECT blocks the tick, and a later tick re-renders from ME.
async function switchShop(shopId) {
  if (!shopId || !ME || shopId === ME.shop_id) return;
  try {
    await api("/api/merchant/switch-shop", {method: "POST", body: {shop_id: shopId}});
    ME = await api("/api/admin/me");
    const _sel = document.getElementById("shopSwitch");
    if (_sel) _sel.blur();
    MO_ORDER_FILTER = "";
    renderNav();
    if (CURRENT_VIEW) showView(CURRENT_VIEW);
  } catch (e) {
    try { ME = await api("/api/admin/me"); } catch (e2) {}
    renderNav();
    showSwitchToast(t("common.err") + " \u2014 " + (e.message || e));
  }
}
function renderNav() {
  const nav = navFor(ME.role);
  let html = "";
  nav.forEach(n => {
    if (n.sect) html += `<div class="sect">${esc(t(n.sect))}</div>`;
    const badge = NAV_BADGES[n.badge];
    const tag = n.soon ? `<span class="soon">${esc(t("nav.soon"))}</span>`
      : (badge !== undefined && badge !== null ? `<span class="badge">${esc(String(badge))}</span>` : "");
    html += `<button data-view="${n.id}" class="${CURRENT_VIEW === n.id ? "active" : ""}"><span class="ic">${NAV_ICONS[n.id] || "•"}</span>${esc(t("nav." + n.id))} ${tag}</button>`;
  });
  $("#navMenu").innerHTML = html
    + `<div class="sect">${esc(t("nav.account"))}</div>`
    + `<button data-view="__me"><span class="ic">👤</span>${esc(ME.display_name || ME.username)}</button>`;
  $("#navMenu").querySelectorAll("button[data-view]").forEach(b => b.addEventListener("click", () => {
    if (b.dataset.view === "__me") { showView("overview"); return; }
    setSidebar(false); showView(b.dataset.view);
  }));
  $("#rolePill").textContent = {owner:"Owner", finance:"Finance", support:"Support", operations:"Operations", merchant:"Merchant"}[ME.role] || ME.role;
  $("#userName").textContent = ME.display_name || ME.username;
  const _rolePill2 = document.querySelector(".owner-pill");
  if (_rolePill2) _rolePill2.textContent = (ME.role === "merchant" && ME.shop_name) ? ME.shop_name : "Platform Owner Dashboard";
  // Multi-shop switcher (v19.82): only merchants with 2+ linked shops
  // get the select; the pill above keeps showing the selected shop.
  const _sw = document.getElementById("shopSwitchWrap");
  if (_sw) {
    const _shops = (ME.role === "merchant" && Array.isArray(ME.shops)) ? ME.shops : [];
    if (_shops.length > 1) {
      _sw.classList.remove("hidden");
      _sw.innerHTML = `<select id="shopSwitch" aria-label="Shop">${_shops.map(s => `<option value="${s.id}"${s.id === ME.shop_id ? " selected" : ""}>${esc(s.name)}</option>`).join("")}</select>`;
      document.getElementById("shopSwitch").addEventListener("change", ev => switchShop(Number(ev.target.value)));
    } else { _sw.classList.add("hidden"); _sw.innerHTML = ""; }
  }
  // v19.86 (Min 2026-11-25): Platform Status is owner-only —
  // merchants never see API/Dashboard internals or the version line.
  $("#sideFoot").innerHTML = (ME.role === "merchant") ? "" : `<div class="status-card"><div class="status-t">Platform Status</div>
      <div class="status-row"><span><span class="dot"></span>API</span><b class="ok">Online</b></div>
      <div class="status-row"><span><span class="dot"></span>Dashboard</span><b class="ok">Online</b></div>
      <div class="status-row"><span>Safe Deli v1.0.0 (Owner)</span></div></div>`;
}
// View history + scroll memory (v19.62): every view gets a back button
// (head()), and a same-view refresh keeps the page exactly where it was.
const VIEW_HISTORY = [];
const SCROLL_MEM = {};
let BACK_NAV = false;
function goBack() {
  const prev = VIEW_HISTORY.pop();
  BACK_NAV = true;
  showView(prev || "overview");
}
function showRefreshNote() {
  const v = $("#view"); if (!v) return;
  if (v.querySelector(".refresh-note")) return;
  const n = document.createElement("div");
  n.className = "refresh-note";
  n.style.cssText = "margin:0 0 10px;padding:8px 12px;border-radius:10px;background:#fff7e0;color:#7a5b00;font-size:13px;line-height:1.5";
  n.textContent = t("common.refreshNote");
  v.prepend(n);
}
function hideRefreshNote() {
  const n = document.querySelector("#view .refresh-note"); if (n) n.remove();
}
async function showView(id, opts) {
  if (!VIEWS[id]) id = "overview";
  const _prev = CURRENT_VIEW;
  if (_prev) SCROLL_MEM[_prev] = window.scrollY || 0;
  if (!BACK_NAV && _prev && _prev !== id) { VIEW_HISTORY.push(_prev); if (VIEW_HISTORY.length > 20) VIEW_HISTORY.shift(); }
  BACK_NAV = false;
  CURRENT_VIEW = id;
  if (ME) lsSet(DASH_VIEW_KEY, id);
  renderNav();
  const v = $("#view");
  // v19.63: a quiet same-view refresh (auto-refresh tick) never blanks
  // the page: the old list stays until the new data arrives, and a
  // failed fetch keeps the old list with a small retry note.
  const keepOld = !!(opts && opts.quiet) && _prev === id && v.dataset.rendered === "1";
  if (!keepOld) v.innerHTML = `<div class="card"><div class="empty">${esc(t("common.loading"))}</div></div>`;
  try { await VIEWS[id](v); v.dataset.rendered = "1"; hideRefreshNote(); }
  catch (e) { if (keepOld) { showRefreshNote(); } else { v.innerHTML = `<div class="card"><button type="button" class="btn ghost sm" onclick="goBack()">\u2190 ${esc(t("common.back"))}</button><h1>${esc(t("common.errTitle"))}</h1><p class="err-text">${esc(e.message || e)}</p></div>`; } }
  const _to = SCROLL_MEM[id];
  window.scrollTo(0, _to === undefined ? 0 : _to);
  applySearchFilter();
  startRefreshTimer();
}
function head(title, sub, extra) {
  return `<div class="view-head"><button type="button" class="btn ghost sm" onclick="goBack()">\u2190 ${esc(t("common.back"))}</button><div><h1>${esc(title)}</h1><div class="muted">${esc(sub || "")}</div></div><div class="spacer"></div>${extra || ""}</div>`;
}

/* ---------- Overview v2 (dark preview design, real data only) ---------- */
function ovMapPct(lat, lon) {
  // Same crop as the preview map: z17, tiles x 101904-101906, y 57925-57926, crop (77,168,589,368).
  const z = 17, n = 1 << z;
  const x = (lon + 180) / 360 * n;
  const la = lat * Math.PI / 180;
  const y = (1 - Math.log(Math.tan(la) + 1 / Math.cos(la)) / Math.PI) / 2 * n;
  const px = x * 256 - 101904 * 256, py = y * 256 - 57925 * 256;
  const cx = (px - 77) / 512 * 100, cy = (py - 168) / 200 * 100;
  if (cx < 0 || cx > 100 || cy < 0 || cy > 100) return null;
  return {x: cx.toFixed(1), y: cy.toFixed(1)};
}
let OV_CAR = {items: [], i: 0};
function ovCarRender() {
  const img = document.getElementById("ovCarImg");
  if (!img || !OV_CAR.items.length) return;
  const it = OV_CAR.items[OV_CAR.i];
  img.src = it.image_url || it.image || "";
  img.alt = it.title || "";
  const cap = document.getElementById("ovCarCap");
  if (cap) cap.textContent = "Slide " + (OV_CAR.i + 1) + " / " + OV_CAR.items.length + " — " + (it.title || "");
  document.querySelectorAll("#ovCarDots span").forEach((d, k) => d.classList.toggle("on", k === OV_CAR.i));
}
function ovCarGo(d) { if (!OV_CAR.items.length) return; OV_CAR.i = (OV_CAR.i + d + OV_CAR.items.length) % OV_CAR.items.length; ovCarRender(); }
function ovCarSet(k) { OV_CAR.i = k; ovCarRender(); }
async function ovDishSave(id, fields) {
  try { await api("/api/admin/home-dishes/" + id, {method: "PUT", body: fields}); }
  catch (e) { showView("overview"); }
}
async function ovDishMove(id, dir) {
  const d = await api("/api/admin/home-dishes").catch(() => ({dishes: []}));
  const dishes = d.dishes || [];
  const i = dishes.findIndex(x => x.id === id);
  const j = i + dir;
  if (i < 0 || j < 0 || j >= dishes.length) return;
  await api("/api/admin/home-dishes/" + dishes[j].id, {method: "PUT", body: {sort_order: dishes[i].sort_order}});
  await api("/api/admin/home-dishes/" + dishes[i].id, {method: "PUT", body: {sort_order: dishes[j].sort_order}});
  showView("overview");
}
async function ovDishDel(id) {

  await api("/api/admin/home-dishes/" + id, {method: "DELETE"});

}

/* ---------- Categories (dish categories, real counts) ---------- */
async function viewCategories(v) {
  const d = await api("/api/admin/home-dishes").catch(() => ({dishes: []}));
  const dishes = d.dishes || [];
  const catCount = {};
  dishes.forEach(x => { catCount[x.category] = (catCount[x.category] || 0) + 1; });
  const circles = HOME_DISH_CATS.map((c, i) => {
    const first = dishes.find(x => x.category === c.id);
    const photo = first && first.image_url ? `<img src="${esc(first.image_url)}" alt="">` : `<div class="ph ${i % 2 ? "gol" : "pur"}">${esc(c.name.trim().charAt(0))}</div>`;
    return `<div class="ov-cat"><a href="javascript:void(0)" onclick="document.querySelectorAll('#catList .ov-cat').forEach(e=>e.style.opacity=.55);this.closest('.ov-cat').style.opacity=1;document.getElementById('catDetail').innerHTML=window.__catDetail('${c.id}')">${photo}</a><div class="nm">${esc(c.name)}</div><div class="cnt">${esc(t("cat.dishesN").replace("{n}", fmtNum(catCount[c.id] || 0)))}</div></div>`;
  }).join("");
  window.__catDetail = (cid) => {
    const rows = dishes.filter(x => x.category === cid).map(x => `<div class="ov-rail-row"><div><div class="nm">${esc(x.name)}</div><div class="sub">${esc(homeDishCatName(x.category))} • ${x.price !== null && x.price !== undefined ? "฿" + fmtNum(x.price) : esc(t("ov2.dishNoPrice"))}</div></div><span class="pill ${x.is_available ? "green" : "grey"}">${esc(x.is_available ? t("ov2.openNow") : t("ov2.closedNow"))}</span></div>`).join("");
    return rows || `<div class="empty">${esc(t("common.empty"))}</div>`;
  };
  v.innerHTML = head(t("cat.t"), t("cat.s"))
    + `<div class="card"><div class="ov-cats" id="catList">${circles}</div><div id="catDetail" style="margin-top:14px"></div>
      <div style="margin-top:14px"><button class="btn" onclick="showView('homeDishes')">${esc(t("cat.viewDishes"))}</button></div></div>`;
}

/* ---------- Banners / Promotions (server banners setting) ---------- */
async function viewBanners(v) {
  const d = await api("/api/admin/settings").catch(() => ({}));
  const set = d.settings || d;
  let banners = Array.isArray(set.banners) ? set.banners.slice() : [];
  let helpVideos = Array.isArray(set.help_videos) ? set.help_videos.slice() : [];
  const vidRows = helpVideos.map((v, i) => `<div class="ov-promo-row">
      <div style="width:76px;height:36px;background:#3A2866;border-radius:6px;flex:0 0 76px;display:flex;align-items:center;justify-content:center;font-size:20px">🎬</div>
      <div style="flex:1;min-width:0"><div class="nm">#${i + 1} — ${esc(v.title || "")}</div><div class="sub">${esc(v.video_url || "")}</div></div>
      <button class="btn sm" onclick="window.__vidMove(${i},-1)" ${i === 0 ? "disabled" : ""}>${esc(t("ban.up"))}</button>
      <button class="btn sm" onclick="window.__vidMove(${i},1)" ${i === helpVideos.length - 1 ? "disabled" : ""}>${esc(t("ban.down"))}</button>
      <button class="btn danger sm" onclick="window.__vidDel(${i})">${esc(t("ban.del"))}</button></div>`).join("");
  window.__vidSaveAll = async (list) => {
    await api("/api/admin/settings", {method: "PUT", body: {help_videos: list}});
    showView("banners");
  };
  window.__vidMove = async (i, dir) => {
    const j = i + dir;
    if (j < 0 || j >= helpVideos.length) return;
    const tmp = helpVideos[i]; helpVideos[i] = helpVideos[j]; helpVideos[j] = tmp;
    helpVideos.forEach((b, k) => { b.sort_order = k + 1; });
    await window.__vidSaveAll(helpVideos);
  };
  window.__vidDel = async (i) => {
    if (!(await askConfirm(t("common.confirmDelete") || "Delete?"))) return;
    helpVideos.splice(i, 1);
    helpVideos.forEach((b, k) => { b.sort_order = k + 1; });
    await window.__vidSaveAll(helpVideos);
  };
  window.__vidAdd = async () => {
    const url = (document.getElementById("vidUrl") || {}).value || "";
    const title = (document.getElementById("vidTitle") || {}).value || "";
    if (!url.trim()) { document.getElementById("vidErr").textContent = t("vid.urlPh"); return; }
    helpVideos.push({video_url: url.trim(), title: title.trim(), sort_order: helpVideos.length + 1, is_active: true});
    await window.__vidSaveAll(helpVideos);
  };
  const rows = banners.map((b, i) => `<div class="ov-promo-row">
      ${b.image_url ? `<img src="${esc(b.image_url)}" alt="">` : `<div style="width:76px;height:36px;background:#3A2866;border-radius:6px;flex:0 0 76px"></div>`}
      <div style="flex:1;min-width:0"><div class="nm">#${i + 1} — ${esc(b.title || "")}</div><div class="sub">${esc(b.image_url || "")}${b.link_url ? " → " + esc(b.link_url) : ""}</div></div>
      <button class="btn sm" onclick="window.__banMove(${i},-1)" ${i === 0 ? "disabled" : ""}>${esc(t("ban.up"))}</button>
      <button class="btn sm" onclick="window.__banMove(${i},1)" ${i === banners.length - 1 ? "disabled" : ""}>${esc(t("ban.down"))}</button>
      <button class="btn danger sm" onclick="window.__banDel(${i})">${esc(t("ban.del"))}</button></div>`).join("");
  window.__banSaveAll = async (list) => {
    await api("/api/admin/settings", {method: "PUT", body: {banners: list}});
    showView("banners");
  };
  window.__banMove = async (i, dir) => {
    const j = i + dir;
    if (j < 0 || j >= banners.length) return;
    const tmp = banners[i]; banners[i] = banners[j]; banners[j] = tmp;
    banners.forEach((b, k) => { b.sort_order = k + 1; });
    await window.__banSaveAll(banners);
  };
  window.__banDel = async (i) => {
    if (!(await askConfirm(t("common.confirmDelete") || "Delete?"))) return;
    banners.splice(i, 1);
    banners.forEach((b, k) => { b.sort_order = k + 1; });
    await window.__banSaveAll(banners);
  };
  window.__banAdd = async () => {
    const img = (document.getElementById("banImg") || {}).value || "";
    const title = (document.getElementById("banTitle") || {}).value || "";
    const link = (document.getElementById("banLink") || {}).value || "";
    if (!img.trim()) { document.getElementById("banErr").textContent = t("ban.imgPh"); return; }
    banners.push({image_url: img.trim(), title: title.trim(), link_url: link.trim() || null, sort_order: banners.length + 1});
    await window.__banSaveAll(banners);
  };
  window.__banExport = () => {
    /* v19.37: the app reads banners.json from GitHub Pages, so the
       dashboard's banners reach the app only after this file is
       uploaded to the repo as banners.json. */
    const list = banners.map((b, k) => ({image_url: b.image_url || "", link_url: b.link_url || null, title: b.title || "", sort_order: k + 1, is_active: true}));
    const blob = new Blob([JSON.stringify({banners: list}, null, 2)], {type: "application/json"});
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "banners.json";
    document.body.appendChild(a);
    a.click();
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
  };
  v.innerHTML = head(t("ban.t"), t("ban.s"))

        </div></div>
      <div class="err-text" id="banErr"></div><div class="ok-text" id="banOk"></div>
      <p class="muted small" style="margin-top:10px">${esc(t("ov2.promoNote"))}</p></div>`
    + `<div class="card" style="margin-top:14px"><h2>${esc(t("vid.t"))}</h2>

      <p class="muted small" style="margin-top:10px">${esc(t("vid.note"))}</p></div>`;

/* ---------- Shop form helpers (2026-11-13 rebuild) ----------
   AM/PM time picker (no typing — the old typed "7:00" was rejected by
   the API), Maps-link coordinate parsing, and plain-Burmese error text
   so the API's technical English never reaches the user raw. ---------- */
function timePickerHTML(prefix) {
  const hours = Array.from({length: 12}, (_, i) => `<option value="${i + 1}">${i + 1}</option>`).join("");
  const mins = [0, 5, 10, 15, 20, 25, 30, 35, 40, 45, 50, 55]
    .map(m => `<option value="${String(m).padStart(2, "0")}">${String(m).padStart(2, "0")}</option>`).join("");
  return `<div class="time-picker"><select id="${prefix}H" aria-label="hour">${hours}</select><select id="${prefix}M" aria-label="minute">${mins}</select><select id="${prefix}AP" aria-label="AM/PM"><option value="AM">AM</option><option value="PM">PM</option></select></div>`;
}
function timePickerRead(prefix) {
  const h12 = Number($("#" + prefix + "H").value);
  const min = $("#" + prefix + "M").value;
  const ap = $("#" + prefix + "AP").value;
  let h24 = h12 % 12; if (ap === "PM") h24 += 12;
  return String(h24).padStart(2, "0") + ":" + min;
}
function timePickerSet(prefix, hhmm) {
  const m = /^(\d{2}):(\d{2})$/.exec(hhmm || "");
  const hourSel = $("#" + prefix + "H"), minSel = $("#" + prefix + "M"), apSel = $("#" + prefix + "AP");
  if (!m || !hourSel || !minSel || !apSel) return;
  let h = Number(m[1]); const minStr = String(Number(m[2])).padStart(2, "0");
  const ap = h >= 12 ? "PM" : "AM";
  let h12 = h % 12; if (h12 === 0) h12 = 12;
  hourSel.value = String(h12);
  // Keep a non-5-minute value (e.g. 07:03 from an old shop) instead of
  // silently rounding it away.
  if (![...minSel.options].some(o => o.value === minStr)) {
    const opt = document.createElement("option");
    opt.value = minStr; opt.textContent = minStr; minSel.appendChild(opt);
  }
  minSel.value = minStr;
  apSel.value = ap;
}
function parseMapsLink(url) {
  if (!url) return null;
  let m = /@(-?\d+(?:\.\d+)?),(-?\d+(?:\.\d+)?)/.exec(url);
  if (m) return {lat: Number(m[1]), lon: Number(m[2])};
  m = /[?&](?:q|ll)=(-?\d+(?:\.\d+)?),(-?\d+(?:\.\d+)?)/.exec(url);
  if (m) return {lat: Number(m[1]), lon: Number(m[2])};
  m = /!3d(-?\d+(?:\.\d+)?)!4d(-?\d+(?:\.\d+)?)/.exec(url);
  if (m) return {lat: Number(m[1]), lon: Number(m[2])};
  return null; // Short links (maps.app.goo.gl) carry no coordinates —
  // the GPS fields stay as they are; the save is not blocked.
}
function shopUrlList(value) {
  return (value || "").split("\n").map(s => s.trim()).filter(Boolean);
}
// API error message (prefix) -> plain-Burmese i18n key. Anything

// --- Shop media upload (2026-11-13): pick a photo/video from the
// phone's files, upload it, and the URL fills itself in + a preview
// appears. No links needed. The URL field stays as a fallback.
async function apiUpload(path, formData) {
  // FormData sets its own multipart Content-Type (with boundary), so
  // no Content-Type header here — unlike api(), which sends JSON.
  const res = await fetch(path, {
    method: "POST",
    headers: TOKEN ? {"Authorization": "Bearer " + TOKEN} : {},
    body: formData
  });
  const ct = res.headers.get("content-type") || "";
  const data = ct.includes("application/json") ? await res.json().catch(() => ({})) : {};
  if (!res.ok) {
    const err = new Error((data && data.error) || ("HTTP " + res.status));
    err.status = res.status; throw err;
  }
  return data;
}
function uploadErrText(err) {
  const msg = (err && err.message) || "";
  if (msg.indexOf("Only JPG, PNG or WebP") === 0) return t("sh.up.badType");
  if (msg.indexOf("Only MP4, WebM or MOV") === 0) return t("sh.up.badVideo");
  if (msg.indexOf("File is too large") === 0) {
    return (msg.indexOf("100 MB") >= 0) ? t("sh.up.videoTooBig") : t("sh.up.tooBig");
  }
  return t("sh.up.failed");
}
function mediaThumb(url, isVideo, isNew) {
  // The picture sits inside the app's gold frame (same style as the
  // shop-photo and Menu dish cards) — never a bare thumbnail.
  const inner = isVideo
    ? `<video src="${esc(url)}" controls preload="metadata" playsinline></video>`
    : `<img src="${esc(url)}" alt="">`;
  const badge = isNew ? `<span class="new-badge">NEW</span>` : "";
  return `<div class="frame-gold">${inner}${badge}</div>`;
}

function renderMediaThumbs() {
  // Show the pictures already in the fields (edit mode, or a link
  // pasted by hand), so Min can SEE them before saving.
  const set = (el, urls, isVideo, isNew) => { if (el) el.innerHTML = urls.filter(Boolean).map(u => mediaThumb(u, isVideo, isNew)).join(""); };
  set($("#shPhotoThumb"), [$("#shPhoto") ? $("#shPhoto").value.trim() : ""], false, false);
  set($("#shLogoThumb"), [$("#shLogo") ? $("#shLogo").value.trim() : ""], false, false);
  set($("#shPhotosThumb"), shopUrlList($("#shPhotos") ? $("#shPhotos").value : ""), false, false);
  set($("#shInteriorThumb"), shopUrlList($("#shInterior") ? $("#shInterior").value : ""), false, false);
  set($("#shMenuThumb"), [$("#shMenu") ? $("#shMenu").value.trim() : ""], false, menuIsNew);
  set($("#shVideoThumb"), [$("#shVideo") ? $("#shVideo").value.trim() : ""], true, false);
}
function bindUpload(fileInputId, kind, isVideo, applyUrl, statusId, thumbId) {
  const input = $(fileInputId);
  if (!input) return;
  input.addEventListener("change", async () => {
    const files = Array.from(input.files || []);
    input.value = "";
    if (!files.length) return;
    const status = $(statusId), thumb = $(thumbId);
    UPLOADS_BUSY++;
    try {
    for (const file of files) {
      if (status) status.textContent = t("sh.up.uploading");
      // Show the picked file at once (local preview) while it uploads.
      // Single photo/video: replace the frame. Photo lists: add a frame.
      let localUrl = null;
      try { localUrl = URL.createObjectURL(file); } catch (e) {}
      if (localUrl && thumb) {
        if (input.multiple) thumb.insertAdjacentHTML("beforeend", mediaThumb(localUrl, isVideo));
        else thumb.innerHTML = mediaThumb(localUrl, isVideo);
      }
      const fd = new FormData();
      fd.append("kind", kind);
      fd.append("file", file);
      try {
        const r = await apiUpload("/api/admin/media", fd);
        if (localUrl) { try { URL.revokeObjectURL(localUrl); } catch (e) {} }
        await applyUrl(r.url);
        if (status) status.textContent = t("sh.up.done");
        renderMediaThumbs();
      } catch (e) {
        if (localUrl) { try { URL.revokeObjectURL(localUrl); } catch (e2) {} }
        if (status) status.textContent = uploadErrText(e);
        // Leave the picked picture visible (do not re-render): Min
        // can SEE it is the right photo and pick it again to retry.
      }
    }
    } finally { UPLOADS_BUSY--; }
  });
}

      ${isOwner ? `<h3 style="margin-top:16px" id="shFormTitle">${esc(t("sh.formAdd"))}</h3>

      </div><div class="muted small" style="margin-top:8px">${t("sh.gpsHint")}</div><div class="err-text" id="shErr"></div><div class="ok-text" id="shOk"></div>` : ""}
    </div>`;
  let shEditId = null, shSaving = false;
  // Add mode: the pickers start at the global hours (06:00 / 22:00).
  timePickerSet("open", "06:00"); timePickerSet("close", "22:00");
  // Pasting a Maps link fills the GPS pin from its coordinates.
  const shMaps = $("#shMaps");
  if (shMaps) shMaps.addEventListener("change", () => {
    const p = parseMapsLink(shMaps.value.trim());
    if (p) { $("#shLat").value = p.lat; $("#shLon").value = p.lon; }
  });
  // "GPS yuu-mal" — fill lat/lon from the phone GPS when Min stands at the shop.
  const shGpsBtn = $("#shGpsBtn"), shGpsNote = $("#shGpsNote");
  if (shGpsBtn) shGpsBtn.addEventListener("click", () => {
    if (!navigator.geolocation) { if (shGpsNote) shGpsNote.textContent = t("sh.gpsNoApi"); return; }
    shGpsBtn.disabled = true; shGpsBtn.textContent = t("sh.gpsWait");
    if (shGpsNote) shGpsNote.textContent = "";
    navigator.geolocation.getCurrentPosition(pos => {
      $("#shLat").value = pos.coords.latitude; $("#shLon").value = pos.coords.longitude;
      if (shGpsNote) shGpsNote.textContent = t("sh.gpsOk");
      shGpsBtn.disabled = false; shGpsBtn.textContent = "📍 " + t("sh.gpsBtn");
    }, err => {
      if (shGpsNote) shGpsNote.textContent = (err && err.code === 1) ? t("sh.gpsDenied") : t("sh.gpsFail");
      shGpsBtn.disabled = false; shGpsBtn.textContent = "📍 " + t("sh.gpsBtn");
    }, {enableHighAccuracy: true, timeout: 15000, maximumAge: 0});
  });
  // Media upload: pick a photo/video from the phone's files — no link
  // box (Min 2026-11-13: links are not wanted). The uploaded URL is
  // kept in a hidden field and a preview appears in the gold frame.
  // A fresh form starts with no NEW menu.
  menuIsNew = false;
  bindUpload("#shPhotoFile", "shop", false, url => { $("#shPhoto").value = url; }, "#shPhotoStatus", "#shPhotoThumb");
  bindUpload("#shLogoFile", "shop", false, url => { $("#shLogo").value = url; }, "#shLogoStatus", "#shLogoThumb");
  bindUpload("#shPhotosFile", "shop", false, url => { const ta = $("#shPhotos"); ta.value = (ta.value.trim() ? ta.value.trim() + "\n" : "") + url; }, "#shPhotosStatus", "#shPhotosThumb");
  bindUpload("#shInteriorFile", "interior", false, url => { const ta = $("#shInterior"); ta.value = (ta.value.trim() ? ta.value.trim() + "\n" : "") + url; }, "#shInteriorStatus", "#shInteriorThumb");
  bindUpload("#shMenuFile", "menu", false, url => { $("#shMenu").value = url; menuIsNew = true; }, "#shMenuStatus", "#shMenuThumb");
  bindUpload("#shVideoFile", "video", true, url => { $("#shVideo").value = url; }, "#shVideoStatus", "#shVideoThumb");
  renderShopBanners();
  v.querySelectorAll("[data-sh-edit]").forEach(b => b.addEventListener("click", async () => {
    const s = (d.shops || []).find(x => String(x.id) === b.dataset.shEdit);
    if (!s) return;
    // Hours first: if they cannot be loaded, say so and do NOT open
    // the form — opening it with default hours would silently
    // overwrite the shop's real hours on save.
    let h;
    try { h = await api(`/api/admin/shops/${s.id}/hours`); }
    catch (e) { shopErr($("#shErr"), e); return; }
    shEditId = s.id;
    $("#shName").value = s.name || ""; $("#shType").value = s.category || "";
    $("#shAddr").value = s.address || ""; $("#shPhone").value = s.phone || "";
    $("#shLat").value = s.latitude != null ? s.latitude : ""; $("#shLon").value = s.longitude != null ? s.longitude : "";
    // New/media fields — the admin list now returns them all.
    $("#shMaps").value = s.maps_url || "";
    $("#shPhoto").value = s.photo_url || "";
    $("#shLogo").value = s.logo_url || "";
    $("#shPhotos").value = (s.photo_urls || []).join("\n");
    $("#shInterior").value = (s.interior_photo_urls || []).join("\n");
    $("#shVideo").value = s.video_url || "";
    $("#shMenu").value = s.menu_url || "";

    renderMediaThumbs();
    timePickerSet("open", h.open_time || "06:00"); timePickerSet("close", h.close_time || "22:00");
    $("#shFormTitle").textContent = t("sh.formEdit").replace("{n}", s.name || "");
    $("#shSave").textContent = t("common.save"); $("#shCancel").classList.remove("hidden");
    renderShopBanners();
    window.scrollTo(0, document.body.scrollHeight);

  v.querySelectorAll("[data-sh-toggle]").forEach(b => b.addEventListener("click", async () => {
    const toStatus = b.dataset.shStatus;

    catch (e) { shopErr($("#shErr"), e); }
  }));
  // --- True delete (owner only, 2026-11-18): removes the shop for good.
  // The server blocks it when the shop has orders or a linked merchant
  // account; those errors surface via shopErr, like the other shop errors.
  v.querySelectorAll("[data-sh-delete]").forEach(b => b.addEventListener("click", async () => {
    if (!(await askConfirm(t("sh.confirmDelete")))) return;
    try { await api(`/api/admin/shops/${b.dataset.shDelete}`, {method: "DELETE"}); showView("shops"); }

  }));
  // --- Per-shop open/close (owner only, manual + immediate, any time, no schedule) ---
  v.querySelectorAll("[data-sh-oc]").forEach(b => b.addEventListener("click", async () => {
    const toOpen = b.dataset.shOpen === "1" ? 1 : 0;
    try {
      await api(`/api/admin/shops/${b.dataset.shOc}`, {method: "PUT", body: {is_open: toOpen}});
    } catch (e) { shopErr($("#shErr"), e); return; }
    showView("shops");
  }));
  const shSave = $("#shSave");
  if (shSave) shSave.addEventListener("click", async () => {
    // Double-submit guard (2026-11-13): extra taps on Add created
    // duplicate shops. The button is disabled while a save is in
    // flight, and the server dedupes identical replays by name+phone.
    if (shSaving) return;

    const name = $("#shName").value.trim(), addr = $("#shAddr").value.trim(), phone = $("#shPhone").value.trim();
    if (!name) { shopErrKey(errEl, "sh.err.name"); return; }
    if (!addr) { shopErrKey(errEl, "sh.err.address"); return; }
    if (!phone) { shopErrKey(errEl, "sh.err.phone"); return; }
    const open = timePickerRead("open"), close = timePickerRead("close");
    if (open === close) { shopErrKey(errEl, "sh.err.sameTime"); return; }

    const lat = $("#shLat").value.trim(), lon = $("#shLon").value.trim();

    shSaving = true; shSave.disabled = true; shSave.textContent = t("sh.saving");
    try {
      let shopId = shEditId;

      await api(`/api/admin/shops/${shopId}/hours`, {method: "PUT", body: {open_time: open, close_time: close}});
      showView("shops");

  // --- Shop promo banners (v19.77, Min 2026-11-24) -------------------

  // that dish to the cart (options sheet first when it has choices).
  let shBanDishes = null, shBanDishesFor = null, shBanList = [];
  async function shBanLoadDishes() {
    if (shBanDishes && shBanDishesFor === shEditId) return shBanDishes;
    const d = await api("/api/admin/home-dishes").catch(() => ({dishes: []}));
    shBanDishes = (d.dishes || []).filter(x => x.shop_id === shEditId);
    shBanDishesFor = shEditId;

  async function renderShopBanners() {
    const sec = $("#shBannerSec");
    if (!sec) return;
    if (!shEditId) { sec.innerHTML = `<p class="muted small">${esc(t("ban2.saveFirst"))}</p>`; return; }

    try { const d = await api(`/api/admin/shops/${shEditId}/promo-banners`); banners = d.banners || []; }
    catch (e) { shopErr($("#shBanErr"), e); sec.innerHTML = ""; return; }
    shBanList = banners;
    const dishes = await shBanLoadDishes().catch(() => []);
    const rows = banners.map((b, i) => {
      const dishOpts = dishes.map(x => `<option value="${x.id}"${x.id === b.dish_id ? " selected" : ""}>${esc(x.name)}</option>`).join("");
      return `<div class="ov-promo-row" style="flex-wrap:wrap"><img src="${esc(b.image_url)}" alt=""><div class="ov-promo-meta"><b>${esc(b.dish_name)}</b><span class="muted small">${i + 1} / ${banners.length}${b.is_active ? "" : " · " + esc(t("ban2.hidden"))}</span></div>` +
        `<select data-ban-dish="${b.id}" aria-label="${esc(t("ban2.dishPh"))}" style="flex:1 1 120px;min-width:120px">${dishOpts}</select>` +
        `<label class="muted small"><input type="checkbox" data-ban-active="${b.id}"${b.is_active ? " checked" : ""}> ${esc(t("ban2.active"))}</label>` +
        `<button class="btn sm" data-ban-up="${b.id}"${i === 0 ? " disabled" : ""}>${esc(t("ban.up"))}</button>` +
        `<button class="btn sm" data-ban-down="${b.id}"${i === banners.length - 1 ? " disabled" : ""}>${esc(t("ban.down"))}</button>` +
        `<button class="btn ghost sm" data-ban-del="${b.id}">✕</button></div>`;
    }).join("");
    const dishOpts = dishes.map(x => `<option value="${x.id}">${esc(x.name)}</option>`).join("");
    const addRow = dishes.length
      ? `<div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:8px"><input id="shBanFile" type="file" accept="image/*"><select id="shBanDish"><option value="">${esc(t("ban2.dishPh"))}</option>${dishOpts}</select><button class="btn sm" id="shBanAdd">${esc(t("ban2.add"))}</button></div><p class="muted small">${esc(t("ban2.note"))}</p>`
      : `<p class="muted small">${esc(t("ban2.noDishes"))}</p>`;
    sec.innerHTML = (banners.length ? rows : `<p class="muted small">${esc(t("ban2.empty"))}</p>`) + addRow;
    sec.querySelectorAll("[data-ban-dish]").forEach(sel => sel.addEventListener("change", async () => {
      const id = Number(sel.dataset.banDish), dish = dishes.find(x => x.id === Number(sel.value));
      if (!dish) return;
      try { await api(`/api/admin/shop-promo-banners/${id}`, {method: "PUT", body: {dish_id: dish.id, dish_name: dish.name}}); await renderShopBanners(); }
      catch (e) { shopErr($("#shBanErr"), e); }
    }));
    sec.querySelectorAll("[data-ban-active]").forEach(cb => cb.addEventListener("change", async () => {
      const id = Number(cb.dataset.banActive);
      try { await api(`/api/admin/shop-promo-banners/${id}`, {method: "PUT", body: {is_active: cb.checked}}); await renderShopBanners(); }
      catch (e) { shopErr($("#shBanErr"), e); }
    }));
    sec.querySelectorAll("[data-ban-up]").forEach(btn => btn.addEventListener("click", () => shBanMove(Number(btn.dataset.banUp), -1)));
    sec.querySelectorAll("[data-ban-down]").forEach(btn => btn.addEventListener("click", () => shBanMove(Number(btn.dataset.banDown), 1)));
    sec.querySelectorAll("[data-ban-del]").forEach(btn => btn.addEventListener("click", async () => {
      const id = Number(btn.dataset.banDel);
      try { await api(`/api/admin/shop-promo-banners/${id}`, {method: "DELETE"}); await renderShopBanners(); }
      catch (e) { shopErr($("#shBanErr"), e); }
    }));
    const addBtn = $("#shBanAdd");
    if (addBtn) addBtn.addEventListener("click", async () => {
      const fi = $("#shBanFile"), sel = $("#shBanDish");
      const f = fi && fi.files && fi.files[0];
      const dish = dishes.find(x => x.id === Number(sel && sel.value));
      if (!f || !dish) { shopErrKey($("#shBanErr"), "ban2.pick"); return; }
      addBtn.disabled = true;
      try {
        const fd = new FormData();
        fd.append("kind", "promo");
        fd.append("file", f);

        try { const r = await apiUpload("/api/admin/media", fd); url = r.url || ""; }
        catch (ue) { const el = $("#shBanErr"); if (el) el.textContent = uploadErrText(ue); return; }

async function prodSave(id, fields) {
  // Inline product edit (name / price): same pattern as ovDishSave.
  // An empty or invalid price is rejected and the list re-renders,
  // restoring the old value (product price cannot be cleared).
  try {
    if ("price" in fields && (fields.price == null || isNaN(fields.price) || fields.price < 0)) {
      showErr($("#prodErr"), "price must be a number");
      showView("products");
      return;
    }
    await api(`/api/admin/products/${id}`, {method: "PUT", body: fields});
  } catch (e) { showErr($("#prodErr"), e); showView("products"); }
}

/* ---------- home-dish options editor (v19.66, API v19.60) ---------- */
/* One option group in the editor; extra groups on a dish are preserved
   untouched (HD_EDIT_EXTRA). The group label is typed by Min/owner --
   never pre-filled. */
let HD_EDIT_EXTRA = [];
function optSummary(p) {
  if (!p.options || !p.options.length) return "";
  const txt = p.options.map(g => esc(g.group) + (g.multi ? " [" + (g.min == null ? 0 : g.min) + "-" + (g.max == null ? g.choices.length : g.max) + "]" : "") + ": " + g.choices.map(c => esc(c.name) + (c.price ? " (+" + fmtNum(c.price) + ")" : "")).join(", ")).join(" \u00b7 ");
  return `<br><span class="muted small">\u2699\ufe0f ${txt}</span>`;
}
function optChoiceRowHtml(c) {
  return `<div class="opt-row"><input class="opt-name" placeholder="${esc(t("hd.optChoice"))}" value="${esc((c && c.name) || "")}"><input class="opt-price" type="number" min="0" step="0.01" placeholder="${esc(t("hd.optExtra"))}" value="${(c && typeof c.price === "number") ? c.price : ""}"><button class="btn sm danger" type="button" data-opt-del aria-label="\u2715">\u2715</button></div>`;
}
function bindOptEditor() {
  const box = $("#hfOptChoices");
  if (!box) return;
  const add = $("#hfOptAdd");
  if (add) add.addEventListener("click", () => { box.insertAdjacentHTML("beforeend", optChoiceRowHtml(null)); });
  box.addEventListener("click", e => {
    const del = e.target.closest("[data-opt-del]");
    if (del) del.closest(".opt-row").remove();
  });
}
function fillOptEditor(options) {
  const g = (options && options[0]) || null;
  const grp = $("#hfOptGroup"); if (grp) grp.value = g ? g.group : "";
  const stp = $("#hfOptStep"); if (stp) stp.value = g ? (g.step || "") : "";
  const req = $("#hfOptReq"); if (req) req.checked = g ? !!g.required : true;
  const mul = $("#hfOptMulti"); if (mul) mul.checked = g ? !!g.multi : false;
  const mn = $("#hfOptMin"); if (mn) mn.value = g && g.multi ? (g.min == null ? (g.required ? 1 : 0) : g.min) : "";
  const mx = $("#hfOptMax"); if (mx) mx.value = g && g.multi ? (g.max == null ? g.choices.length : g.max) : "";
  HD_EDIT_EXTRA = (options && options.length > 1) ? options.slice(1) : [];
  const box = $("#hfOptChoices");
  if (box) box.innerHTML = (g ? g.choices : []).map(optChoiceRowHtml).join("");
}
function readDishOptions() {
  const grp = $("#hfOptGroup");
  if (!grp) return null;
  const label = grp.value.trim();
  const rows = [...document.querySelectorAll("#hfOptChoices .opt-row")].map(r => {
    const name = r.querySelector(".opt-name").value.trim();
    const raw = r.querySelector(".opt-price").value.trim();
    const price = raw === "" ? 0 : Number(raw);
    return {name, price, raw};
  }).filter(c => c.name !== "" || c.raw !== "");
  if (!label && rows.length === 0) return HD_EDIT_EXTRA.length ? HD_EDIT_EXTRA : null;
  if (!label || rows.length === 0 || rows.some(c => !c.name || !isFinite(c.price) || c.price < 0)) throw new Error(t("hd.optErr"));
  const multi = !!$("#hfOptMulti") && $("#hfOptMulti").checked;
  let mn = !!$("#hfOptReq").checked ? 1 : 0, mx = 1;
  if (multi) {
    const rawMn = $("#hfOptMin").value.trim(), rawMx = $("#hfOptMax").value.trim();
    mn = rawMn === "" ? (!!$("#hfOptReq").checked ? 1 : 0) : Number(rawMn);
    mx = rawMx === "" ? rows.length : Number(rawMx);
    if (!Number.isInteger(mn) || !Number.isInteger(mx) || mn < 0 || mx < mn || mx > rows.length) throw new Error(t("hd.optErr"));
  }
  const step = $("#hfOptStep") ? $("#hfOptStep").value.trim() : "";
  return [{group: label, required: !!$("#hfOptReq").checked, multi, min: mn, max: mx, step, choices: rows.map(c => ({name: c.name, price: c.price}))}, ...HD_EDIT_EXTRA];
}

      <div class="kpi grad g4"><div class="lbl">${esc(t("fin.ordersTotal"))}</div><div class="val">${fmtNum(s.orders.total)}</div><div class="trend">${esc(t("fin.todayN").replace("{n}", fmtNum(s.orders.today)))}</div></div>
      <div class="kpi grad g5"><div class="lbl">${esc(t("ov.kpi.shops"))}</div><div class="val">${fmtNum(s.shops.total)}</div><div class="trend">${esc(t("fin.shopsApproved").replace("{n}", fmtNum(s.shops.active)))}</div></div>
    </div>`
    + `<div class="grid cards2" style="margin-top:14px">
      <div class="card"><h2>${esc(t("fin.payT"))}</h2>${donut(methodParts, methodTotal, methodTotal ? fmtMoney(methodTotal, cur) : "0", t("fin.fromListed"))}<div class="muted small">${esc(t("fin.donutNote"))}</div></div>

        <div><label class="flabel">${esc(t("fin.in"))} / ${esc(t("fin.out"))}</label><select id="lgDir"><option value="in">${esc(t("fin.in"))} (in)</option><option value="out">${esc(t("fin.out"))} (out)</option></select></div>
        <div><label class="flabel">${esc(t("prod.f.currency"))}</label><select id="lgCur"><option value="THB">${esc(t("fin.curThb"))}</option><option value="MMK">${esc(t("fin.curMmk"))}</option></select></div>
        <div><label class="flabel">${esc(t("fin.f.method"))}</label><input id="lgMethod" placeholder="Cash / KBZPay / Wave"></div>
        <div><label class="flabel">${esc(t("fin.f.shop"))}</label><input id="lgShop" type="number" min="1"></div>

      + (isOwner ? `<span style="margin-left:auto;display:flex;gap:6px"><button class="btn ghost sm" data-st-edit="${esc(ty.key)}">${esc(t("set.types.editType"))}</button><button class="btn ghost sm" data-st-toggle="${esc(ty.key)}" data-st-enabled="${ty.enabled ? 0 : 1}">${ty.enabled ? esc(t("set.types.disable")) : esc(t("set.types.enable"))}</button><button class="btn danger sm" data-st-del="${esc(ty.key)}">${esc(t("set.types.del"))}</button></span>` : "")
      + `</li>`).join("")}</ul>` : `<div class="empty">${esc(t("common.empty"))}</div>`;
    wrap.querySelectorAll("[data-st-edit]").forEach(b => b.addEventListener("click", () => {
      const ty = types.find(x => x.key === b.dataset.stEdit);
      if (!ty) return;
      stEditKey = ty.key;
      $("#stNameMy").value = ty.name_my; $("#stNameEn").value = ty.name_en || "";
      $("#stFormTitle").textContent = t("set.types.editT") + typeName(ty);
      $("#stSave").textContent = t("common.save"); $("#stCancel").classList.remove("hidden");
    }));
    wrap.querySelectorAll("[data-st-toggle]").forEach(b => b.addEventListener("click", async () => {
      try { await api(`/api/admin/shop-types/${encodeURIComponent(b.dataset.stToggle)}`, {method: "PUT", body: {enabled: b.dataset.stEnabled === "1"}}); showView("settings"); }
      catch (e) { showErr($("#stErr"), e); }
    }));
    wrap.querySelectorAll("[data-st-del]").forEach(b => b.addEventListener("click", async () => {
      if (!(await askConfirm(t("set.types.confirmDel")))) return;
      try { await api(`/api/admin/shop-types/${encodeURIComponent(b.dataset.stDel)}`, {method: "DELETE"}); showView("settings"); }
      catch (e) { showErr($("#stErr"), e); }
    }));
  }
  loadShopTypes();
  const stSave = $("#stSave");
  if (stSave) stSave.addEventListener("click", async () => {
    const body = {name_my: $("#stNameMy").value.trim(), name_en: $("#stNameEn").value.trim()};
    try {
      if (stEditKey) { await api(`/api/admin/shop-types/${encodeURIComponent(stEditKey)}`, {method: "PUT", body}); $("#stOk").textContent = t("common.saved"); }
      else { await api("/api/admin/shop-types", {method: "POST", body}); $("#stOk").textContent = t("common.saved"); }
      showView("settings");
    } catch (e) { showErr($("#stErr"), e); }
  });
  const stCancel = $("#stCancel");
  if (stCancel) stCancel.addEventListener("click", () => showView("settings"));
  // --- Settings backup (owner only) ---
  const bkExport = $("#bkExport");
  if (bkExport) bkExport.addEventListener("click", async () => {
    try {
      const dd = await api("/api/admin/settings");
      const ss = dd.settings || dd;
      const blob = new Blob([JSON.stringify(ss, null, 2)], {type: "application/json"});
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob); a.download = "safe-deli-settings.json"; a.click();
      setTimeout(() => URL.revokeObjectURL(a.href), 5000);
      $("#bkOk").textContent = t("common.saved");
    } catch (e) { showErr($("#bkErr"), e); }
  });
  const bkImport = $("#bkImportFile");
  if (bkImport) bkImport.addEventListener("change", async e => {
    const f = e.target.files && e.target.files[0];
    if (!f) return;
    const KNOWN = ["global_hours", "delivery", "banners", "registration_form", "hero_image", "promo_slots", "featured_shop_ids", "contact"];
    try {
      const obj = JSON.parse(await f.text());
      if (!obj || typeof obj !== "object" || Array.isArray(obj)) throw new Error(t("set.backup.errJson"));
      const bad = Object.keys(obj).filter(k => KNOWN.indexOf(k) === -1);
      if (bad.length) throw new Error(t("set.backup.errKey").replace("{n}", bad.join(", ")));
      const results = [];
      for (const k of Object.keys(obj)) {
        try {
          const body = {}; body[k] = obj[k];
          await api("/api/admin/settings", {method: "PUT", body});
          results.push(k + ": OK");
        } catch (err) {
          results.push(k + ": FAIL — " + (err.message || err));
        }
      }
      BK_RESULTS = `<ul class="checklist">${results.map(r => `<li>${esc(r)}</li>`).join("")}</ul>`;
      showView("settings");
    } catch (err) { showErr($("#bkErr"), err); }
  });
  if (BK_RESULTS) { const br = $("#bkResults"); if (br) br.innerHTML = BK_RESULTS; BK_RESULTS = null; }
}

async function viewUsers(v) {
  const d = await api("/api/admin/users");
  const shops = await api("/api/admin/shops?limit=100").catch(() => ({shops: []}));
  // Linked shops (v19.82, owner only): merchants that may view
  // several shops, and the active+verified shops that can be linked.
  const _merchants = (d.users || []).filter(u => u.role === "merchant");
  const _linkable = (shops.shops || []).filter(s2 => s2.status === "active" && s2.verified);
  const rows = (d.users || []).map(u => `<tr><td><b>${esc(u.username)}</b><br><span class="muted small">${esc(u.display_name || "")}</span></td>
    <td><span class="pill purple">${esc(u.role)}</span>${u.shop_id ? `<br><span class="muted small">${esc(t("us.shopN").replace("{n}", String(u.shop_id)))}</span>` : ""}</td>
    <td>${u.is_active ? `<span class="pill green">${esc(t("us.active"))}</span>` : `<span class="pill grey">${esc(t("us.inactive"))}</span>`}</td>
    <td><span class="muted small">${fmtDate(u.created_at)}</span></td></tr>`).join("");
  v.innerHTML = head(t("v.users.t"), t("v.users.s"))
    + `<div class="card">${tableOrEmpty(`<th>${esc(t("us.th.user"))}</th><th>${esc(t("us.th.role"))}</th><th>${esc(t("ov.th.status"))}</th><th>${esc(t("sh.th.since"))}</th>`, rows)}
      <h3 style="margin-top:16px">${esc(t("us.linkedT"))}</h3>
      ${_merchants.length ? `<div class="form-grid">
        <div><label class="flabel">${esc(t("us.linkedPick"))}</label><select id="lkUser">${_merchants.map(u => `<option value="${u.id}">${esc(u.username)}</option>`).join("")}</select></div>
        <div class="full"><div id="lkShops" class="linked-shops"></div><div class="muted small">${esc(t("us.linkedHint"))}</div></div>
        <div class="full"><button class="btn sm" id="lkSave">${esc(t("us.linkedSave"))}</button></div>
      </div><div class="err-text" id="lkErr"></div><div class="ok-text" id="lkOk"></div>`
      : `<div class="muted small">${esc(t("us.linkedNone"))}</div>`}
      <h3 style="margin-top:16px">${esc(t("us.newT"))}</h3>
      <div class="form-grid">
        <div><label class="flabel">Username</label><input id="nuUser" placeholder="${esc(t("us.ph.user"))}"></div>
        <div><label class="flabel">${esc(t("us.f.name"))}</label><input id="nuName"></div>
        <div><label class="flabel">${esc(t("us.th.role"))}</label><select id="nuRole"><option value="support">support</option><option value="finance">finance</option><option value="operations">operations</option><option value="merchant">merchant</option><option value="owner">owner</option></select></div>
        <div><label class="flabel">${esc(t("us.f.pass"))}</label><input id="nuPass" type="password"></div>
        <div id="nuShopWrap" class="hidden"><label class="flabel">${esc(t("us.f.shop"))}</label><select id="nuShop">${(shops.shops || []).map(s2 => `<option value="${s2.id}">${esc(s2.name)}</option>`).join("")}</select></div>
        <div class="full"><button class="btn sm" id="nuSave">${esc(t("us.create"))}</button></div>
      </div><div class="err-text" id="nuErr"></div><div class="ok-text" id="nuOk"></div></div>`;
  $("#nuRole").addEventListener("change", e => $("#nuShopWrap").classList.toggle("hidden", e.target.value !== "merchant"));
  $("#nuSave").addEventListener("click", async () => {
    const body = {username: $("#nuUser").value.trim(), display_name: $("#nuName").value.trim(), role: $("#nuRole").value, password: $("#nuPass").value};
    if (body.role === "merchant") body.shop_id = Number($("#nuShop").value);
    try { await api("/api/admin/users", {method: "POST", body}); $("#nuOk").textContent = t("us.created"); showView("users"); }
    catch (e) { showErr($("#nuErr"), e); }
  });
  // Linked-shops control: fetch the merchant's links, show the
  // primary shop disabled+checked, diff on Save (POST new links,
  // DELETE removed ones). Shop names are data, never translated.
  const _lkUser = $("#lkUser");
  if (_lkUser) {
    const _lkShops = $("#lkShops");
    async function _loadLinks() {
      const uid = Number(_lkUser.value);
      _lkShops.innerHTML = `<div class="muted small">${esc(t("common.loading"))}</div>`;
      $("#lkErr").textContent = ""; $("#lkOk").textContent = "";
      try {
        const lk = await api("/api/admin/users/" + uid + "/shops");
        const linked = new Set((lk.shops || []).map(s2 => s2.id));
        if (!_linkable.length) { _lkShops.innerHTML = `<div class="muted small">${esc(t("us.linkedNone"))}</div>`; return; }
        _lkShops.innerHTML = _linkable.map(s2 => {
          const isP = s2.id === lk.primary_shop_id;
          return `<label><input type="checkbox" data-shop="${s2.id}"${linked.has(s2.id) ? " checked" : ""}${isP ? " disabled" : ""}> <span>${esc(s2.name)}</span>${isP ? ` <span class="pill new">${esc(t("us.linkedPrimary"))}</span>` : ""}</label>`;
        }).join("");
      } catch (e) { showErr($("#lkErr"), e); _lkShops.innerHTML = ""; }
    }
    _lkUser.addEventListener("change", _loadLinks);
    $("#lkSave").addEventListener("click", async () => {
      const uid = Number(_lkUser.value);
      const want = new Set([..._lkShops.querySelectorAll("input[type=checkbox]")].filter(b => b.checked).map(b => Number(b.dataset.shop)));
      try {
        const lk = await api("/api/admin/users/" + uid + "/shops");
        const have = new Set((lk.shops || []).map(s2 => s2.id));
        for (const sid of want) if (!have.has(sid)) await api("/api/admin/users/" + uid + "/shops", {method: "POST", body: {shop_id: sid}});
        for (const sid of have) if (!want.has(sid) && sid !== lk.primary_shop_id) await api("/api/admin/users/" + uid + "/shops/" + sid, {method: "DELETE"});
        await _loadLinks();
        $("#lkOk").textContent = t("us.linkedSaved"); $("#lkErr").textContent = "";
      } catch (e) { showErr($("#lkErr"), e); $("#lkOk").textContent = ""; }
    });
    _loadLinks();
  }
}

/* ---------- Merchant views ---------- */
let MO_RANGE = {from: "", to: ""};
let MO_ORDER_FILTER = "";
let MO_ORDERS_RANGE = {from: "", to: ""};
async function viewMerchantOverview(v) {
  const q = (MO_RANGE.from && MO_RANGE.to) ? `?date_from=${MO_RANGE.from}&date_to=${MO_RANGE.to}` : "";
  const s = await api("/api/merchant/summary" + q);
  let itemsData = null, itemsErr = null;
  try { itemsData = await api("/api/merchant/item-sales" + q); } catch (e) { itemsErr = e; }
  const settled = s.settled_by_currency || [];
  const bs = s.orders_by_status || {};
  const grp = {
    pending: (bs.pending || 0) + (bs.waiting || 0),
    working: (bs.confirmed || 0) + (bs.preparing || 0) + (bs.delivering || 0),
    done: bs.delivered || 0,
    cancelled: bs.cancelled || 0
  };
  const an = s.analytics || {};
  const cur = s.sales_currency || null;
  const money = n => cur ? fmtMoney(n, cur) : fmtNum(n);
  const mkpi = (label, val, trend, cls) => `<div class="ov-kpi ${cls}"><div class="l">${esc(label)}</div><div class="v">${val}</div><div class="t">${esc(trend)}</div></div>`;
  const card = (g, label, n, cls) => `<button type="button" class="ov-kpi ${cls}" data-mfilter="${g}" style="text-align:left;cursor:pointer;border:0;font:inherit"><div class="l">${esc(label)}</div><div class="v">${fmtNum(n)}</div></button>`;
  const cxRows = (s.cancelled_orders || []).map(o => `<tr><td><b>${esc(o.order_no)}</b><br><span class="muted small">${fmtDate(o.created_at)}</span></td><td>${esc(o.customer_name || "")}</td><td>${esc(o.phone || "")}</td><td>—</td></tr>`).join("");
  let itemsHtml = "";
  if (itemsErr) {
    itemsHtml = `<div class="muted small">${esc((itemsErr && itemsErr.message) || itemsErr)}</div>`;
  } else if (itemsData) {
    const isd = itemsData;

    + `<div class="card" style="margin-bottom:14px"><div class="row-flex" style="gap:10px;flex-wrap:wrap;align-items:end">
      <div><label class="flabel">${esc(t("mo2.range"))}</label><div class="row-flex" style="gap:6px"><input type="date" id="moOrdFrom" value="${esc(MO_ORDERS_RANGE.from)}" style="max-width:150px"><span>–</span><input type="date" id="moOrdTo" value="${esc(MO_ORDERS_RANGE.to)}" style="max-width:150px"></div></div>
