    + `<div class="card">${tableOrEmpty(`<th>${esc(t("ov.th.order"))}</th><th>${esc(t("ov.th.customer"))}</th><th>${esc(t("prod.th.product"))}</th><th>${esc(t("ov.th.status"))}</th><th>${esc(t("ord.th.fee"))}</th><th>${esc(t("ord.th.action"))}</th>`, rows)}
      <div style="margin-top:12px"><button class="btn ghost sm" id="mCsv">${esc(t("ord.csv"))}</button></div><div class="err-text" id="mErr"></div></div>`;
  const sa = $("#moShowAll");
  if (sa) sa.addEventListener("click", () => { MO_ORDER_FILTER = ""; MO_ORDERS_RANGE = {from: "", to: ""}; showView("morders"); });
  $("#moOrdApply").addEventListener("click", () => {

/* ---------- login (v19.66: form on first open, direct re-entry after, Min 2026-11-23) ---------- */
/* The login screen shows on the FIRST open in this browser: Min taps
   Log in to enter, so he can see the form (and the password eye).
   Once entered, later opens and refreshes re-enter directly to the
   saved view (the token is still validated silently; a dead token
   shows the form again). Logout clears the token and the flag, so
   the form shows again. A saved token only pre-fills the username;
   tapping Log in with the saved username re-validates the token, and
   tapping with a different username logs in with typed credentials. */
function savedViewFor(role) {
  const dflt = role === "merchant" ? "moverview" : "overview";
  const v = lsGet(DASH_VIEW_KEY, null);
  if (!v || v === dflt) return dflt;
  try { if (navFor(role).some(n => n.id === v)) return v; } catch (e) {}
  return dflt;
}
async function enterApp() {
  showRestoreNote(false);
  $("#loginWrap").classList.add("hidden"); $("#app").classList.remove("hidden");
  lsSet(DASH_ENTERED_KEY, "1");
  startRefreshTimer();
  showView(savedViewFor(ME.role));
}
async function fetchMeWithRetry(gen) {
  // Returns ME on success, null when the token is dead (401/403), and
  // "stale" when the generation moved on. Network errors keep the
  // token and retry with backoff (v19.63 semantics, unchanged).
  let wait = 2000;
  for (;;) {
    if (gen !== RESTORE_GEN) return "stale";
    try {
      ME = await api("/api/admin/me");
      return ME;
    } catch (err) {
      if (err && (err.status === 401 || err.status === 403)) { TOKEN = null; ME = null; lsDel(DASH_TOKEN_KEY); lsDel(DASH_USER_KEY); lsDel(DASH_ENTERED_KEY); return null; }
      showRestoreNote(true);
      await sleepMs(wait);
      if (wait < 15000) wait *= 2;
    }
  }
}
$("#loginForm").addEventListener("submit", async e => {
  e.preventDefault();
  const gen = ++RESTORE_GEN;
  const btn = $("#loginBtn"); btn.disabled = true; $("#loginErr").textContent = "";
  try {
    const typedUser = $("#username").value.trim();
    const savedUser = lsGet(DASH_USER_KEY, null);
    if (TOKEN && savedUser && typedUser === savedUser) {
      // Saved-account path: re-validate the token, never the password.
      const me = await fetchMeWithRetry(gen);
      if (me === "stale") return;
      if (!me) { $("#loginErr").textContent = t("login.err401"); return; }
      await enterApp();
      return;
    }
    const d = await api("/api/admin/login", {method: "POST", body: {username: typedUser, password: $("#password").value}});
    TOKEN = d.token || d.session_token;
    if (!TOKEN) throw new Error(t("login.errToken"));
    lsSet(DASH_TOKEN_KEY, TOKEN);
    ME = await api("/api/admin/me");
    lsSet(DASH_USER_KEY, ME.username || typedUser);
    await enterApp();
  } catch (err) {
    $("#loginErr").textContent = err.status === 401 ? t("login.err401") : t("common.err") + " — " + (err.message || err);
  } finally { btn.disabled = false; }
});

/* ---------- saved-account prefill (v19.66) ---------- */
/* On load, a saved token is validated SILENTLY (retry with backoff on
   a weak line, exactly like v19.63). First open in this browser:
   pre-fill the username and show the saved-account note; Min taps
   Log in. Once entered (logout clears it), any later open or refresh
   re-enters directly to the saved view. */
(async function prefetchSavedLogin() {
  const gen = ++RESTORE_GEN;
  const saved = lsGet(DASH_TOKEN_KEY, null);
  if (!saved) return;
  TOKEN = saved;
  const me = await fetchMeWithRetry(gen);
  if (me === "stale" || !me) { showRestoreNote(false); return; }
  if (me.username) lsSet(DASH_USER_KEY, me.username);
  if (lsGet(DASH_ENTERED_KEY, null) === "1") { await enterApp(); return; }
  const u = $("#username");
  if (u && !u.value) u.value = me.username || "";
  const sn = $("#savedNote");
  if (sn) { sn.textContent = t("login.savedNote"); sn.classList.remove("hidden"); }
  showRestoreNote(false);
})();
function showRestoreNote(on) {
  const el = $("#loginErr");
  if (el) el.textContent = on ? t("login.restoring") : "";
}
